        // Компонент автодополнения (защищенный от падений)
        const AutocompleteInput = ({ options, value, onChange, name, placeholder, colorScheme = 'emerald', icon = 'fa-magnifying-glass', clearOnSelect = false }) => {
            const [isOpen, setIsOpen] = useState(false);

            useEffect(() => {
                setSearchTerm(value || '');

                const handleClickOutside = (event) => {
                    if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const filteredOptions = (options || []).filter(opt => {
                const searchStr = (searchTerm || '').toLowerCase();
                const nameMatch = opt.name ? opt.name.toLowerCase().includes(searchStr) : false;
                const codeMatch = opt.code ? opt.code.toLowerCase().includes(searchStr) : false;
                return nameMatch || codeMatch;
            });

            const handleInputChange = (e) => {
                const newValue = e.target.value;
                setSearchTerm(newValue);
                setIsOpen(true);
                onChange({ target: { name, value: newValue } });
            };

            const handleSelect = (opt) => {
                const newValue = opt.group ? opt : `${opt.code} - ${opt.name}`;
                
                if (clearOnSelect) {
                    setSearchTerm('');
                    setIsOpen(false);
                    onChange(newValue);
                } else {
                    setSearchTerm(typeof newValue === 'string' ? newValue : newValue.name);

                    onChange({ target: { name, value: newValue } });

        // Изолируем хуки useState и useEffect, чтобы не ломать основной цикл React
        const TransitionScreen = ({ text, startProgress, endProgress }) => {
            const [currentProgress, setCurrentProgress] = useState(startProgress);

            useEffect(() => {
                let animationFrameId;
                const duration = 1200; 
                const startTime = performance.now();

                const animate = (time) => {
                    const elapsed = time - startTime;
                    const progressRatio = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progressRatio, 3);
                    
                    setCurrentProgress(Math.floor(startProgress + (endProgress - startProgress) * easeOut));

                    if (progressRatio < 1) {
                        animationFrameId = requestAnimationFrame(animate);
                    }
                };
                animationFrameId = requestAnimationFrame(animate);
                
                return () => cancelAnimationFrame(animationFrameId);
            }, [startProgress, endProgress]);

            const radius = 70;
            const circumference = 2 * Math.PI * radius;
            const strokeDashoffset = circumference - ((currentProgress || 0) / 100) * circumference;

            // ЭКРАН 6: ДАШБОРД (ЛИЧНЫЙ КАБИНЕТ)

                    let physical = 100;
                    let emotional = 100;
                    
                    // Физика
                    if (formData.hasChronic) physical -= safeArray(formData.chronicDiagnoses).length * 10;
                    if (formData.arviFrequency === '3-4') physical -= 10;
                    if (formData.arviFrequency === 'often') physical -= 20;
                    if (formData.painLevel && parseInt(formData.painLevel) > 6) physical -= 10;
                    const bmi = calculateBMI();
                    if (bmi && bmi.category !== 'Норма') physical -= 15;
                    
                    // Эмоции
                    const stress = parseInt(formData.stressLevel) || 5;
                    if (stress > 5) emotional -= (stress - 5) * 5;
                    if (formData.sleepQuality === 'fair') emotional -= 15;
                    if (formData.sleepQuality === 'poor') emotional -= 25;
                    if (formData.moodState === 'anxious' || formData.moodState === 'depressed') emotional -= 20;

                    if (formData.hasPsychiatricDisorder) emotional -= safeArray(formData.psychDiagnoses).length * 15;

                                                    <div className="flex-1">
                                                        <h4 className="font-bold text-slate-800">{appt.specialty}</h4>
                                                        <p className="text-xs text-slate-500 mt-0.5">{appt.doctor} • {appt.time}</p>
                                                    </div>
                                                    <button onClick={() => removeAppointment(appt.id)} className="text-slate-300 hover:text-rose-500 transition-colors p-2">
                                                        <i className="fa-solid fa-xmark"></i>
                                                    </button>
                                                </div>
                                            ))}
                                            <button onClick={addAppointment} className="w-full bg-indigo-50 text-indigo-600 p-3.5 rounded-2xl font-bold border-2 border-dashed border-indigo-200 hover:bg-indigo-100 transition-colors text-sm">
                                                <i className="fa-solid fa-plus mr-1.5"></i> Добавить еще запись
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* Нижняя навигация (Таббар) */}
                        <div className="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 pb-safe pt-2 px-6 flex justify-around items-center z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                            <button 
                                onClick={() => setDashboardTab('main')} 
                                className={`flex flex-col items-center gap-1 p-2 w-20 transition-colors ${dashboardTab === 'main' ? 'text-indigo-600' : 'text-slate-400 hover:text-slate-600'}`}
                            >
                                <i className={`text-xl fa-solid ${dashboardTab === 'main' ? 'fa-house' : 'fa-house'}`}></i>
                                <span className="text-[10px] font-bold">Главная</span>
                            </button>
                            
                            <button 
                                onClick={() => setDashboardTab('researches')} 
                                className={`flex flex-col items-center gap-1 p-2 w-20 transition-colors ${dashboardTab === 'researches' ? 'text-indigo-600' : 'text-slate-400 hover:text-slate-600'}`}
                            >
                                <div className="relative">
                                    <i className={`text-xl fa-solid ${dashboardTab === 'researches' ? 'fa-folder-open' : 'fa-folder'}`}></i>
                                    {dashboardTab === 'main' && reliability < 90 && <span className="absolute -top-1 -right-2 w-3 h-3 bg-rose-500 rounded-full border-2 border-white animate-pulse"></span>}
                                </div>
                                <span className="text-[10px] font-bold">Исследования</span>
                            </button>

                            <button
                                onClick={() => setDashboardTab('appointments')}
                                className={`flex flex-col items-center gap-1 p-2 w-20 transition-colors ${dashboardTab === 'appointments' ? 'text-indigo-600' : 'text-slate-400 hover:text-slate-600'}`}
                            >
                                <div className="relative">
                                    <i className={`text-xl fa-solid ${dashboardTab === 'appointments' ? 'fa-calendar-check' : 'fa-calendar'}`}></i>
                                    {appointments.length > 0 && (
                                        <span className="absolute -top-1.5 -right-2 min-w-[16px] h-4 px-1 bg-indigo-600 rounded-full border-2 border-white text-[9px] text-white font-bold flex items-center justify-center">{appointments.length}</span>
                                    )}
                                </div>
                                <span className="text-[10px] font-bold">Приемы</span>
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <React.Fragment>
                    {transitionConfig.isTransitioning ? (
                        <TransitionScreen 
                            text={transitionConfig.text}
                            startProgress={transitionConfig.startProgress}
                            endProgress={transitionConfig.endProgress}
                        />
                    ) : (
                        <React.Fragment>
                            {currentScreen === 1 && renderOnboardingScreen()}
                            {currentScreen === 2 && renderMedicalScreen()}
                            {currentScreen === 3 && renderPsychologyScreen()}
                            {currentScreen === 4 && renderReviewScreen()}
                            {currentScreen === 5 && renderSuccessScreen()}
                            {currentScreen === 6 && renderDashboardScreen()}
                            {currentScreen === 7 && renderProfileScreen()}
                        </React.Fragment>
                    )}
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
