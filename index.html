        // Компонент автодополнения (защищенный от падений)
        const AutocompleteInput = ({ options, value, onChange, name, placeholder, colorScheme = 'emerald', icon = 'fa-magnifying-glass', clearOnSelect = false, theme = 'dark' }) => {
            const isLight = theme === 'light';
            const [isOpen, setIsOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState(value || '');
            const wrapperRef = useRef(null);

            useEffect(() => {
                setSearchTerm(value || '');
            }, [value]);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            // Безопасная фильтрация с проверками на undefined
            const filteredOptions = (options || []).filter(opt => {
                const searchStr = (searchTerm || '').toLowerCase();
                const nameMatch = opt.name ? opt.name.toLowerCase().includes(searchStr) : false;
                const codeMatch = opt.code ? opt.code.toLowerCase().includes(searchStr) : false;
                return nameMatch || codeMatch;
            });

            const handleInputChange = (e) => {
                const newValue = e.target.value;
                setSearchTerm(newValue);
                setIsOpen(true);
                if (!clearOnSelect) {
                    onChange({ target: { name, value: newValue } });
                }
            };

            const handleSelect = (opt) => {
                const newValue = opt.group ? opt : `${opt.code} - ${opt.name}`;
                
                if (clearOnSelect) {
                    setSearchTerm('');
                    setIsOpen(false);
                    onChange(newValue);
                } else {
                    setSearchTerm(typeof newValue === 'string' ? newValue : newValue.name);
                    setIsOpen(false);
                    onChange({ target: { name, value: newValue } });
                }
            };

            const handleSelectCustom = () => {
                const customOpt = { name: searchTerm, code: 'Custom', group: 'Неизвестная группа' };
                if (clearOnSelect) {
                    setSearchTerm('');
                    setIsOpen(false);
                    onChange(customOpt); 
                } else {
                    setIsOpen(false);
                    onChange({ target: { name, value: searchTerm } });
                }
            };

            const borderClass = colorScheme === 'amber' ? 'border-amber-500/20 focus:ring-amber-500' : 
                                colorScheme === 'sky' ? 'border-sky-500/20 focus:ring-sky-500' :
                                colorScheme === 'teal' ? 'border-teal-500/20 focus:ring-teal-500' :
                                'border-emerald-500/20 focus:ring-emerald-500';

                              colorScheme === 'sky' ? 'text-sky-400' :
                              colorScheme === 'teal' ? 'text-teal-400' :
                              'text-emerald-400';
            const hoverClass = colorScheme === 'amber' ? 'hover:bg-amber-500/10' : 
                               colorScheme === 'sky' ? 'hover:bg-sky-500/10' :
                               colorScheme === 'teal' ? 'hover:bg-teal-500/10' :
                               'hover:bg-emerald-500/10';
            const codeTextClass = colorScheme === 'amber' ? 'text-amber-400' : 
                                  colorScheme === 'sky' ? 'text-sky-400' :
                                  colorScheme === 'teal' ? 'text-teal-400' :
                                  'text-emerald-400';

            return (
                <div ref={wrapperRef} className="relative w-full">
                    <div className="relative">
                        <i className={`fa-solid ${icon} absolute left-3 top-3.5 ${iconColor}`}></i>
                        <input
                            type="text"
                            name={name}
                            value={searchTerm}
                            onChange={handleInputChange}

        // --- БЕЗОПАСНЫЙ ЭКРАН ПЕРЕХОДА (ВЫНЕСЕН В ОТДЕЛЬНЫЙ КОМПОНЕНТ) ---
        // Изолируем хуки useState и useEffect, чтобы не ломать основной цикл React
        const TransitionScreen = ({ text, startProgress, endProgress }) => {

                let animationFrameId;
                const duration = 1200; 
                const startTime = performance.now();

                const animate = (time) => {
                    const elapsed = time - startTime;
                    const progressRatio = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progressRatio, 3);
                    
                    setCurrentProgress(Math.floor(startProgress + (endProgress - startProgress) * easeOut));

                    if (progressRatio < 1) {
                        animationFrameId = requestAnimationFrame(animate);
                    }
                };
                animationFrameId = requestAnimationFrame(animate);
                
                return () => cancelAnimationFrame(animationFrameId);
            }, [startProgress, endProgress]);

            const radius = 70;
            const circumference = 2 * Math.PI * radius;
            const strokeDashoffset = circumference - ((currentProgress || 0) / 100) * circumference;

        // Цветовые схемы для календаря цикла (свой профиль / партнёрша)
        const cycleColorMap = {

        // Виджет календаря менструального цикла (переиспользуется и для своего профиля, и для партнёрши)
        const CycleCalendarWidget = ({ lastPeriodDate, cycleDays, label, colorScheme = 'pink' }) => {
            const colors = cycleColorMap[colorScheme];

            const cycleLen = parseInt(cycleDays) || 28;
            const periodLen = 5;
            const lastPeriod = lastPeriodDate ? new Date(lastPeriodDate + 'T00:00:00') : null;

            const cycleOffset = (date) => {
                const diffDays = Math.round((date - lastPeriod) / (1000 * 60 * 60 * 24));
                return ((diffDays % cycleLen) + cycleLen) % cycleLen;
            };
            const ovulationOffset = Math.max(cycleLen - 14, periodLen);
            const isPeriodDay = (date) => lastPeriod ? cycleOffset(date) < periodLen : false;
            const isOvulationDay = (date) => lastPeriod ? cycleOffset(date) === ovulationOffset : false;

            const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            const weekDays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

            const fertileStart = Math.max(ovulationOffset - 2, periodLen);
            const fertileEnd = ovulationOffset + 1;

            const getPhaseName = (offset) => {
                if (offset < periodLen) return 'Менструация';
                if (offset >= fertileStart && offset <= fertileEnd) return 'Фертильное окно';
                if (offset < fertileStart) return 'Фолликулярная фаза';
                return 'Лютеиновая фаза';
            };

            let cycleDayNum = null;
            let daysUntilNext = null;
            let currentPhase = null;
            if (lastPeriod) {
                const modToday = cycleOffset(today);
                cycleDayNum = modToday + 1;
                daysUntilNext = cycleLen - modToday;
                currentPhase = getPhaseName(modToday);
            }

            // --- Кольцевой индикатор фаз цикла ---
            const radius = 50;
            const circumference = 2 * Math.PI * radius;
            const periodFraction = periodLen / cycleLen;
            const fertileFraction = (fertileEnd - fertileStart + 1) / cycleLen;
            const fertileStartFraction = fertileStart / cycleLen;

            // Позиция маркера "Вы здесь" — точное положение сегодняшнего дня на кольце
            const todayFraction = lastPeriod ? cycleOffset(today) / cycleLen : 0;
            const todayAngleRad = (-90 + todayFraction * 360) * Math.PI / 180;
            const todayLeftPct = 50 + 41 * Math.cos(todayAngleRad);
            const todayTopPct = 50 + 41 * Math.sin(todayAngleRad);

            // --- Данные для развернутого месячного календаря ---
            const year = today.getFullYear();
            const month = today.getMonth();
            const firstDay = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startWeekday = (firstDay.getDay() + 6) % 7;
            const daysArray = [];
            for (let i = 0; i < startWeekday; i++) daysArray.push(null);
            for (let d = 1; d <= daysInMonth; d++) daysArray.push(new Date(year, month, d));

                <div className="bg-white rounded-2xl shadow-sm overflow-hidden">

                                        <circle cx="60" cy="60" r={radius} fill="transparent" stroke={colors.hexPeriod} strokeWidth="12"
                                            strokeDasharray={`${periodFraction * circumference} ${circumference}`} strokeLinecap="round" />
                                        <circle cx="60" cy="60" r={radius} fill="transparent" stroke="#7dd3fc" strokeWidth="12"
                                            strokeDasharray={`${fertileFraction * circumference} ${circumference}`}
                                            strokeDashoffset={-fertileStartFraction * circumference}
                                            strokeLinecap="round" />
                                    </svg>
                                    {/* Маркер "Вы здесь" — показывает точное положение сегодняшнего дня на кольце */}
                                    <div
                                        className="absolute w-4 h-4 rounded-full border-2 border-white shadow-md z-10"
                                        style={{ left: `${todayLeftPct}%`, top: `${todayTopPct}%`, transform: 'translate(-50%, -50%)', backgroundColor: colors.hexProgress }}
                                        title="Вы здесь"
                                    ></div>
                                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                                        <span className="text-xl font-extrabold text-[#1F1024]">{cycleDayNum}</span>
                                        <span className="text-[9px] text-gray-500 uppercase font-bold tracking-wide">день цикла</span>
                                    </div>
                                </div>
                                <div className="flex-1 min-w-0">
                                    <div className="text-sm font-bold text-[#1F1024] mb-1.5 flex items-center gap-1.5">
                                        <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: colors.hexProgress }}></span>
                                        {currentPhase}
                                    </div>
                                    <div className={`p-2.5 rounded-xl text-xs font-medium ${colors.banner} mb-2`}>
                                        <div className="font-extrabold text-base leading-tight">{daysUntilNext} {daysUntilNext === 1 ? 'день' : (daysUntilNext >= 2 && daysUntilNext <= 4) ? 'дня' : 'дней'}</div>
                                        <div>до менструации</div>

                                {daysArray.map((date, i) => {

        // Простой линейный график динамики (для ежедневного опроса самочувствия)
        const TrendChart = ({ data, colorHex }) => {

            const points = data.map((d, i) => {

                const y = height - (d.value / maxVal) * height;

            const pointsStr = points.map(p => `${p.x},${p.y}`).join(' ');

            return (

                    {[0, 2.5, 5, 7.5, 10].map(v => (
                        <line key={v} x1="0" x2={width} y1={height - (v / maxVal) * height} y2={height - (v / maxVal) * height} stroke="rgba(255,255,255,0.08)" strokeWidth="0.3" />

        // Основное приложение

            // ================================================

                    const recent = [...checkIns].sort((a, b) => a.date.localeCompare(b.date)).slice(-7);
                    const avg = (key) => (recent.reduce((s, c) => s + c[key], 0) / recent.length).toFixed(1);
                    return `За последние ${recent.length} ${recent.length === 1 ? 'день' : recent.length < 5 ? 'дня' : 'дней'} в среднем: самочувствие ${avg('wellbeing')}/10, энергия ${avg('energy')}/10, настроение ${avg('mood')}/10, стресс ${avg('stress')}/10. Подробный график смотрите в разделе ежедневного опроса на главном экране.`;
                }

                if (has('показател', 'самочувств', 'состояни здоров') || (has('здоровь') && !has('женск'))) {
                    let msg = `Ваши текущие показатели: физическое здоровье — ${scores.physical}%, эмоциональное состояние — ${scores.emotional}%. `;
                    if (scores.physical < 60) msg += 'Физический показатель снижен — это может быть связано с хроническими заболеваниями или частыми ОРВИ из анкеты. ';
                    if (scores.emotional < 60) msg += 'Эмоциональный фон снижен — обратите внимание на уровень стресса и качество сна. ';
                    if (scores.physical >= 80 && scores.emotional >= 80) msg += 'Оба показателя в хорошем диапазоне — так держать! ';
                    msg += `Надежность этой оценки сейчас ${dataReliability}%${dataReliability < 90 ? ' — загрузите исследования, чтобы я могла анализировать точнее.' : '.'}`;
                    return msg;
                }

                if (has('стресс', 'тревог', 'нерв')) {
                    const stress = parseInt(formData.stressLevel) || 0;
                    let msg = `Ваш уровень стресса по анкете — ${stress}/10. `;
                    if (stress >= 7) msg += 'Это высокий уровень. Попробуйте техники дыхания или короткие прогулки в течение дня, и обсудите с врачом, если тревожность мешает повседневным делам.';
                    else if (stress >= 4) msg += 'Умеренный уровень — стоит следить за динамикой.';
                    else msg += 'Хороший, спокойный уровень.';
                    if (formData.hasPsychiatricDisorder && safeArray(formData.psychDiagnoses).length > 0) {
                        msg += ` Учитываю также диагноз: ${formData.psychDiagnoses.map(d => d.text).join(', ')}.`;
                    }
                    return msg;
                }

                if (has('сон', 'сплю', 'высыпа')) {
                    const sleepMap = { excellent: 'отличное', good: 'хорошее', fair: 'удовлетворительное', poor: 'плохое' };
                    const sq = sleepMap[formData.sleepQuality] || 'не указано в анкете';
                    return `Качество сна по анкете: ${sq}. ${(formData.sleepQuality === 'poor' || formData.sleepQuality === 'fair') ? 'Плохой сон напрямую влияет на эмоциональный показатель — попробуйте наладить режим и ограничить экраны перед сном.' : 'Продолжайте в том же духе.'}`;
                }

                if (has('диагноз', 'болезн', 'хроническ', 'заболевани')) {
                    if (allDiagnoses.length === 0) return 'В вашей анкете не зафиксировано ни одного диагноза — это хороший знак!';
                    return `Зафиксированные у вас диагнозы: ${allDiagnoses.join(', ')}. Если что-то из этого беспокоит сейчас сильнее обычного, рекомендую записаться на приём во вкладке «Приёмы».`;
                }

                if (has('препарат', 'лекарств', 'таблет', 'принима')) {
                    const allMeds = [...safeArray(formData.generalMeds), ...safeArray(formData.psychMeds)];
                    if (allMeds.length === 0) return 'В анкете не указано, что вы принимаете какие-либо препараты.';
                    const medsList = allMeds.map(m => `${m.name} (${m.schemeType === 'daily' ? 'ежедневно' : m.schemeType === 'as_needed' ? 'по потребности' : 'курсом'})`).join(', ');
                    return `Вы принимаете: ${medsList}. Не забывайте о регулярности приёма согласно расписанию из анкеты.`;
                }

                if (formData.gender === 'female' && has('цикл', 'менструац', 'овуляц', 'пмс', 'женск')) {
                    if (!formData.lastPeriodDate) return 'В анкете не указана дата последней менструации, поэтому не могу рассчитать цикл.';
                    const cycleLen = parseInt(formData.cycleDays) || 28;
                    const lastPeriod = new Date(formData.lastPeriodDate + 'T00:00:00');
                    const todayD = new Date(); todayD.setHours(0, 0, 0, 0);
                    const diffDays = Math.round((todayD - lastPeriod) / (1000 * 60 * 60 * 24));
                    const offset = ((diffDays % cycleLen) + cycleLen) % cycleLen;
                    const dayNum = offset + 1;
                    const daysUntil = cycleLen - offset;
                    return `Сегодня ${dayNum}-й день вашего цикла. До следующей менструации примерно ${daysUntil} ${daysUntil === 1 ? 'день' : (daysUntil >= 2 && daysUntil <= 4) ? 'дня' : 'дней'}. Подробный календарь с фазами цикла смотрите в личном кабинете.`;

            const generateRecognizedData = (category) => {

                    const marker = labMarkersDict[Math.floor(Math.random() * labMarkersDict.length)];
                    const [minStr, maxStr] = (marker.group || '0–1').split('–');
                    const min = parseFloat((minStr || '0').replace(',', '.')) || 0;
                    const max = parseFloat((maxStr || '1').replace(',', '.')) || min + 1;
                    const span = max - min;
                    const inRange = Math.random() < 0.7;
                    let value = inRange
                        ? min + Math.random() * span
                        : (Math.random() < 0.5 ? min - span * (0.05 + Math.random() * 0.2) : max + span * (0.05 + Math.random() * 0.25));
                    value = Math.max(0, value);
                    const decimals = span < 3 ? 1 : 0;
                    return { name: marker.name, unit: marker.code, normalRange: marker.group, value: value.toFixed(decimals), notes: '' };

                    },
                };
                const preset = mockByCategory[category] || { titles: ['Документ'], notes: ['Данные распознаны автоматически.'] };
                return {
                    name: preset.titles[Math.floor(Math.random() * preset.titles.length)],
                    notes: preset.notes[Math.floor(Math.random() * preset.notes.length)],
                };

            const handleFilesSelected = (e) => {

                const category = uploadCategory;
                const newEntries = files.map(f => ({ id: Date.now() + Math.random(), name: f.name, sourceFileName: f.name, status: 'recognizing' }));
                setUploadedFiles(prev => ({
                    ...prev,
                    [category]: [...safeArray(prev[category]), ...newEntries]
                }));
                newEntries.forEach(entry => {
                    const delay = 1100 + Math.random() * 900;
                    setTimeout(() => {
                        const recognized = generateRecognizedData(category);
                        setUploadedFiles(prev => ({
                            ...prev,
                            [category]: safeArray(prev[category]).map(f => f.id === entry.id ? { ...f, ...recognized, sourceFileName: entry.sourceFileName, status: 'done', recognized: true } : f)
                        }));
                    }, delay);
                });
                e.target.value = '';
            };

            const removeUploadedFile = (category, id) => {
                setUploadedFiles(prev => ({ ...prev, [category]: safeArray(prev[category]).filter(f => f.id !== id) }));
            };

            // --- Ручное добавление исследования (без файла) ---
            const emptyManualEntry = { name: '', unit: '', normalRange: '', value: '', date: '', notes: '' };

            const openManualEntry = (category) => {

                setManualEntryData(emptyManualEntry);

            // Выбор маркера из справочника лаб. анализов — автоматически подтягивает единицу измерения и норму
            const handleMarkerSelect = (e) => {
                const val = e.target.value;
                if (val && typeof val === 'object') {
                    setManualEntryData(prev => ({ ...prev, name: val.name, unit: val.code, normalRange: val.group }));
                } else {
                    setManualEntryData(prev => ({ ...prev, name: val, unit: '', normalRange: '' }));
                }
            };

            const saveManualEntry = () => {
                if (!manualEntryCategory || !manualEntryData.name.trim()) return;
                setUploadedFiles(prev => ({
                    ...prev,
                    [manualEntryCategory]: [...safeArray(prev[manualEntryCategory]), {
                        id: Date.now() + Math.random(),
                        name: manualEntryData.name.trim(),
                        unit: manualEntryData.unit,
                        normalRange: manualEntryData.normalRange,
                        value: manualEntryData.value.trim(),
                        date: manualEntryData.date,
                        notes: manualEntryData.notes.trim(),
                        manual: true
                    }]
                }));
                setManualEntryCategory(null);
                setManualEntryData(emptyManualEntry);
            };

            // --- Записи на прием (мок-данные) ---
            const mockDoctors = [
                { specialty: 'Терапевт', doctor: 'Ковалева Ирина Николаевна' },

                { specialty: 'Эндокринолог', doctor: 'Белов Дмитрий Игоревич' },

                { icon: 'fa-notes-medical', color: 'sky', title: 'Единая медкарта', text: 'Анкета, анализы, диагнозы и препараты — всегда под рукой' },
                { icon: 'fa-robot', color: 'fuchsia', title: 'ИИ-помощник', text: 'Отвечает на вопросы о самочувствии на основе ваших данных' },
                { icon: 'fa-venus', color: 'pink', title: 'Женское здоровье', text: 'Календарь цикла, ПМС и фертильное окно с точным прогнозом' },

                { icon: 'fa-shield-heart', color: 'amber', title: 'Карта безопасности', text: 'Ключевые данные о здоровье всегда под рукой — следите за собой и близкими', soon: true },

                    <div className="w-full max-w-md relative z-10 mt-10">

                            </div>

                const organScores = calculateOrganScores();

                    .map(organ => ({ organ, data: organScores[organ.key] }))

                    <div className="min-h-screen bg-[#0a0a0c] flex flex-col items-center py-10 px-4 relative">

                                    <i className="fa-solid fa-arrow-left text-lg"></i>

                                </div>
                            </div>

                            <div className="p-6 md:p-8 space-y-6">
                                <div className="flex items-start gap-2">
                                    <p className="flex-1 text-xs text-slate-400 leading-relaxed bg-white/[0.04] border border-white/10 rounded-xl p-3">
                                        <i className="fa-solid fa-circle-info text-sky-400 mr-1.5"></i>
                                        Показатели рассчитаны на основе данных анкеты и загруженных анализов — это ориентировочная сводка, а не медицинский диагноз.
                                    </p>
                                    <button
                                        type="button"
                                        onClick={() => setBodyMapInsightsOpen(true)}

                                        title="Показать разбор"

                                        <i className="fa-solid fa-list-check"></i>
                                    </button>
                                </div>

                                <div className="space-y-2">
                                    {organConfig.map(organ => {
                                        const data = organScores[organ.key];
                                        const colors = organStatusColorMap[getBand(data.score)];
                                        const isActive = organ.key === selectedOrgan;
                                        return (
                                            <button

                                                <div className={`w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 ${colors.badge}`}>
                                                    <i className={`fa-solid ${organ.icon}`}></i>

                        {/* Окно-разбор по конкретному органу: внимание, расшифровка, рекомендации, что сдать */}

                                        <div>
                                            <h3 className="font-bold text-amber-400 text-sm flex items-center gap-2 mb-2">

                                                                <p className="text-xs text-slate-400 leading-relaxed">{data.factors.join('; ')}</p>
                                                            )}

                                                <div className="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-sm text-emerald-400">
                                                    <i className="fa-solid fa-circle-check mr-1.5"></i>Явных отклонений по доступным данным не обнаружено.

                                        {missingByOrgan.length > 0 && (
                                            <div>

                                                <div className="space-y-2">
                                                    {missingByOrgan.map(({ organ, missing }) => (
                                                        <div key={organ.key} className="p-3 bg-white/[0.04] rounded-xl border border-white/5">

                                                                <i className={`fa-solid ${organ.icon} text-sky-400`}></i>{organ.name}
                                                            </span>
                                                            <div className="flex flex-wrap gap-1.5">
                                                                {missing.map(m => (
                                                                    <span key={m} className="text-[11px] font-medium px-2 py-1 rounded-full bg-sky-500/10 text-sky-300 border border-sky-500/20">{m}</span>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                                <button
                                                    type="button"
                                                    onClick={() => { setBodyMapInsightsOpen(false); setDashboardTab('researches'); setCurrentScreen(6); }}

                                                            ) : (
                                                                <div key={f.id} className="flex items-start justify-between gap-2 bg-white px-3 py-2 rounded-lg border border-gray-100 text-xs">
                                                                    <span className="flex items-start gap-2 text-gray-600 font-medium min-w-0">
                                                                        <i className={`fa-solid ${f.manual ? 'fa-pen-to-square' : f.recognized ? 'fa-wand-magic-sparkles' : 'fa-file-lines'} ${f.recognized ? 'text-fuchsia-500' : 'text-gray-400'} mt-0.5`}></i>
                                                                        <span className="min-w-0">
                                                                            <span className="block truncate">
                                                                                {f.name}
                                                                                {(f.manual || f.recognized) && f.value && (
                                                                                    <span className="text-sky-600 font-bold"> — {f.value} {f.unit}</span>
                                                                                )}
                                                                                {f.recognized && (
                                                                                    <span className="ml-1.5 text-[9px] font-bold uppercase tracking-wide text-fuchsia-600 bg-fuchsia-50 border border-fuchsia-200 rounded-full px-1.5 py-0.5 align-middle">Распознано</span>
                                                                                )}
                                                                            </span>
                                                                            {f.recognized && f.sourceFileName && (
                                                                                <span className="block text-gray-400 font-normal mt-0.5">Из файла: {f.sourceFileName}</span>
                                                                            )}
                                                                            {(f.manual || f.recognized) && f.normalRange && (
                                                                                <span className="block text-gray-400 font-normal mt-0.5">Норма: {f.normalRange} {f.unit}</span>
                                                                            )}
                                                                            {(f.manual || f.recognized) && (f.date || f.notes) && (
                                                                                <span className="block text-gray-400 font-normal mt-0.5">
                                                                                    {f.date && formatDate(f.date)}{f.date && f.notes ? ' • ' : ''}{f.notes}
                                                                                </span>
                                                                            )}
                                                                        </span>
                                                                    </span>
                                                                    <button onClick={() => removeUploadedFile(cat.key, f.id)} className="text-gray-300 hover:text-rose-500 transition-colors flex-shrink-0">
                                                                        <i className="fa-solid fa-xmark"></i>
                                                                    </button>
                                                                </div>
                                                            )
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="space-y-4 animate-in fade-in slide-in-from-right-4">
                                    <div className="mb-6 px-1">
                                        <h2 className="text-xl font-extrabold text-[#1F1024]">Приемы и консультации</h2>
                                        <p className="text-sm text-gray-500 mt-1">Ваши записи к врачам</p>
                                    </div>

                                    {appointments.length === 0 ? (
                                        <div className="bg-white rounded-2xl border-2 border-dashed border-gray-200 p-8 flex flex-col items-center text-center">
                                            <div className="w-16 h-16 bg-fuchsia-50 text-fuchsia-600 rounded-full flex items-center justify-center text-2xl mb-4">
                                                <i className="fa-solid fa-calendar-check"></i>
                                            </div>
                                            <h3 className="font-bold text-[#1F1024] mb-1">Пока нет записей</h3>
                                            <p className="text-sm text-gray-500 mb-5">Запишитесь к врачу на основе данных вашей анкеты</p>
                                            <button onClick={addAppointment} className="bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-bold py-3 px-6 rounded-full shadow-md shadow-fuchsia-500/25 transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                                                <i className="fa-solid fa-plus mr-2"></i>Записаться на прием
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="space-y-3">
                                            {appointments.map(appt => (
                                                <div key={appt.id} className="bg-white p-4 rounded-2xl shadow-sm flex items-center gap-4">
                                                    <div className="w-12 h-12 bg-fuchsia-50 text-fuchsia-600 rounded-xl flex flex-col items-center justify-center flex-shrink-0">
                                                        <span className="text-[10px] font-bold uppercase leading-none">{appt.month}</span>
                                                        <span className="text-lg font-extrabold leading-none mt-0.5">{appt.day}</span>
                                                    </div>
                                                    <div className="flex-1">
                                                        <h4 className="font-bold text-[#1F1024]">{appt.specialty}</h4>
                                                        <p className="text-xs text-gray-500 mt-0.5">{appt.doctor} • {appt.time}</p>
                                                    </div>
                                                    <button onClick={() => removeAppointment(appt.id)} className="text-gray-300 hover:text-rose-500 transition-colors p-2">
                                                        <i className="fa-solid fa-xmark"></i>
                                                    </button>
                                                </div>
                                            ))}
                                            <button onClick={addAppointment} className="w-full bg-fuchsia-50 text-fuchsia-600 p-3.5 rounded-2xl font-bold border-2 border-dashed border-fuchsia-200 hover:bg-fuchsia-100 transition-colors text-sm">
                                                <i className="fa-solid fa-plus mr-1.5"></i> Добавить еще запись
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* Нижняя навигация (Таббар) — плавающая pill-панель в стиле Friendzy */}
                        <div className="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-white rounded-full shadow-lg shadow-black/10 border border-gray-100 py-2 px-3 flex justify-around items-center z-50">
                            <button onClick={() => setDashboardTab('main')} className="flex items-center justify-center p-1" title="Главная">
                                <div className={`w-11 h-11 rounded-full flex items-center justify-center transition-colors ${dashboardTab === 'main' ? 'bg-fuchsia-600 text-white shadow-md shadow-fuchsia-500/30' : 'text-gray-500'}`}>
                                    <i className="text-lg fa-solid fa-house"></i>
                                </div>
                            </button>

                            <button onClick={() => setDashboardTab('researches')} className="flex items-center justify-center p-1" title="Исследования">
                                <div className={`relative w-11 h-11 rounded-full flex items-center justify-center transition-colors ${dashboardTab === 'researches' ? 'bg-fuchsia-600 text-white shadow-md shadow-fuchsia-500/30' : 'text-gray-500'}`}>
                                    <i className={`text-lg fa-solid ${dashboardTab === 'researches' ? 'fa-folder-open' : 'fa-folder'}`}></i>
                                    {dashboardTab === 'main' && reliability < 90 && <span className="absolute top-0 right-0 w-3 h-3 bg-rose-500 rounded-full border-2 border-white animate-pulse"></span>}
                                </div>
                            </button>

                            <button onClick={() => setDashboardTab('appointments')} className="flex items-center justify-center p-1" title="Приемы">
                                <div className={`relative w-11 h-11 rounded-full flex items-center justify-center transition-colors ${dashboardTab === 'appointments' ? 'bg-fuchsia-600 text-white shadow-md shadow-fuchsia-500/30' : 'text-gray-500'}`}>
                                    <i className={`text-lg fa-solid ${dashboardTab === 'appointments' ? 'fa-calendar-check' : 'fa-calendar'}`}></i>
                                    {appointments.length > 0 && (
                                        <span className="absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 bg-pink-500 rounded-full border-2 border-white text-[9px] text-white font-bold flex items-center justify-center">{appointments.length}</span>
                                    )}
                                </div>
                            </button>
                        </div>
                    </div>
                );
            };

            // ==========================================
            // ОТЧЁТ ДЛЯ ВРАЧА (печать / сохранение в PDF через диалог браузера)
            // ==========================================
            const renderReportModal = () => {
                const scores = calculateHealthScores();
                const bmi = calculateBMI();
                const organScores = calculateOrganScores();
                const allMeds = [...safeArray(formData.generalMeds), ...safeArray(formData.psychMeds)];
                const todayStr = new Date().toISOString().slice(0, 10);

                return (
                    <div className="fixed inset-0 z-[100]">
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm print:hidden" onClick={() => setReportOpen(false)}></div>
                        <div className="fixed inset-0 flex items-center justify-center p-4">
                            <div className="w-full max-w-2xl max-h-[90vh] overflow-y-auto bg-white text-[#1F1024] rounded-3xl shadow-2xl print:max-h-none print:overflow-visible print:shadow-none print:rounded-none print:max-w-none">
                                <div className="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between z-10">
                                    <h2 className="font-bold text-lg">Отчёт для врача</h2>
                                    <div className="flex items-center gap-2">
                                        <button type="button" onClick={() => window.print()} className="bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-bold px-4 py-2 rounded-full text-sm transition-colors">
                                            <i className="fa-solid fa-print mr-1.5"></i>Печать / Сохранить PDF
                                        </button>
                                        <button type="button" onClick={() => setReportOpen(false)} className="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors flex-shrink-0">
                                            <i className="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>
                                </div>

                                <div className="print-report p-8">
                                    <div className="flex items-center justify-between mb-6 pb-4 border-b-2 border-gray-900">
                                        <div>
                                            <h1 className="text-2xl font-extrabold">Медицинская сводка</h1>
                                            <p className="text-sm text-gray-500 mt-1">Сформировано автоматически в приложении «Здоровье» · {formatDate(todayStr)}</p>
                                        </div>
                                        <i className="fa-solid fa-heart-pulse text-3xl text-fuchsia-600"></i>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 mb-6 text-sm">
                                        <div><span className="block text-xs text-gray-400 uppercase font-semibold">Пациент</span><span className="font-bold">{formData.lastName} {formData.firstName} {formData.patronymic}</span></div>
                                        <div><span className="block text-xs text-gray-400 uppercase font-semibold">Дата рождения</span><span className="font-bold">{formatDate(formData.dob)}</span></div>
                                        <div><span className="block text-xs text-gray-400 uppercase font-semibold">Пол</span><span className="font-bold">{formData.gender === 'male' ? 'Мужской' : 'Женский'}</span></div>
                                        {bmi && <div><span className="block text-xs text-gray-400 uppercase font-semibold">ИМТ</span><span className="font-bold">{bmi.value} ({bmi.category})</span></div>}
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 mb-6">
                                        <div className="p-4 bg-gray-50 rounded-xl text-center">
                                            <div className="text-2xl font-extrabold text-emerald-600">{scores.physical}%</div>
                                            <div className="text-xs text-gray-500 uppercase font-semibold">Физическое здоровье</div>
                                        </div>
                                        <div className="p-4 bg-gray-50 rounded-xl text-center">
                                            <div className="text-2xl font-extrabold text-fuchsia-600">{scores.emotional}%</div>
                                            <div className="text-xs text-gray-500 uppercase font-semibold">Ментальное состояние</div>
                                        </div>
                                    </div>

                                    <section className="mb-6">
                                        <h3 className="font-bold text-sm uppercase tracking-wide text-gray-500 mb-2 border-b border-gray-200 pb-1">Диагнозы</h3>
                                        {allDiagnoses.length > 0 ? (
                                            <ul className="text-sm space-y-1">{allDiagnoses.map((d, i) => <li key={i}>• {d}</li>)}</ul>
                                        ) : <p className="text-sm text-gray-400">Диагнозы не зафиксированы</p>}
                                    </section>

                                    <section className="mb-6">
                                        <h3 className="font-bold text-sm uppercase tracking-wide text-gray-500 mb-2 border-b border-gray-200 pb-1">Принимаемые препараты</h3>
                                        {allMeds.length > 0 ? (
                                            <ul className="text-sm space-y-1">
                                                {allMeds.map(m => (
                                                    <li key={m.id}>• {m.name} — {safeArray(m.schedule).map(s => `${s.time}: ${s.dosage}`).join(', ')}</li>
                                                ))}
                                            </ul>
                                        ) : <p className="text-sm text-gray-400">Препараты не назначены</p>}
                                    </section>

                                    {decodedLabResults.length > 0 && (
                                        <section className="mb-6">
                                            <h3 className="font-bold text-sm uppercase tracking-wide text-gray-500 mb-2 border-b border-gray-200 pb-1">Результаты анализов</h3>
                                            <table className="w-full text-sm" style={{ borderCollapse: 'collapse' }}>
                                                <thead>
                                                    <tr className="text-left text-xs text-gray-400 uppercase">
                                                        <th className="pb-1 font-semibold">Показатель</th>
                                                        <th className="pb-1 font-semibold">Значение</th>
                                                        <th className="pb-1 font-semibold">Норма</th>
                                                        <th className="pb-1 font-semibold">Статус</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {decodedLabResults.map(f => (
                                                        <tr key={f.id} className="border-t border-gray-100">
                                                            <td className="py-1.5">{f.name}</td>
                                                            <td className="py-1.5">{f.value} {f.unit}</td>
                                                            <td className="py-1.5 text-gray-400">{f.normalRange}</td>
                                                            <td className="py-1.5">{f.label}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </section>
                                    )}

                                    <section className="mb-6">
                                        <h3 className="font-bold text-sm uppercase tracking-wide text-gray-500 mb-2 border-b border-gray-200 pb-1">Карта тела — сводка по системам</h3>
                                        <table className="w-full text-sm" style={{ borderCollapse: 'collapse' }}>
                                            <tbody>
                                                {organConfig.map(o => (
                                                    <tr key={o.key} className="border-t border-gray-100">
                                                        <td className="py-1.5">{o.name}</td>
                                                        <td className="py-1.5 text-right font-semibold">{organScores[o.key].score}%</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </section>

                                    {formData.gender === 'female' && formData.lastPeriodDate && (
                                        <section className="mb-6">
                                            <h3 className="font-bold text-sm uppercase tracking-wide text-gray-500 mb-2 border-b border-gray-200 pb-1">Женское здоровье</h3>
                                            <p className="text-sm">Длина цикла: {formData.cycleDays} дней · Последняя менструация: {formatDate(formData.lastPeriodDate)}</p>
                                        </section>
                                    )}

                                    <p className="text-[11px] text-gray-400 mt-8 pt-4 border-t border-gray-200 leading-relaxed">
                                        Документ сформирован автоматически на основе данных, введённых пользователем в приложении «Здоровье», и носит информационный характер. Не является медицинским заключением или диагнозом.
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* Печатная версия — видна только в @media print благодаря .print-report */}
                    </div>
                );
            };

            if (!dataLoaded) {
                return (
                    <div className="min-h-screen bg-[#FAF7FC] flex flex-col items-center justify-center gap-4">
                        <div className="w-10 h-10 border-4 border-fuchsia-200 border-t-fuchsia-600 rounded-full animate-spin"></div>
                        <p className="text-sm text-gray-500 font-medium">Загружаем данные из Google Таблицы...</p>
                    </div>
                );
            }

            return (
                <React.Fragment>
                    {isSheetConfigured && (
                        <div className={`fixed bottom-3 right-3 z-[200] text-[11px] font-bold px-3 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 transition-opacity ${syncStatus === 'idle' ? 'opacity-0 pointer-events-none' : 'opacity-100'} ${syncStatus === 'error' ? 'bg-rose-500 text-white' : syncStatus === 'syncing' ? 'bg-amber-500 text-white' : 'bg-emerald-500 text-white'}`}>
                            <i className={`fa-solid ${syncStatus === 'error' ? 'fa-triangle-exclamation' : syncStatus === 'syncing' ? 'fa-arrows-rotate fa-spin' : 'fa-check'}`}></i>
                            {syncStatus === 'error' ? 'Ошибка синхронизации' : syncStatus === 'syncing' ? 'Сохранение...' : 'Сохранено в таблицу'}
                        </div>
                    )}
                    {transitionConfig.isTransitioning ? (
                        <TransitionScreen 
                            text={transitionConfig.text}
                            startProgress={transitionConfig.startProgress}
                            endProgress={transitionConfig.endProgress}
                        />
                    ) : (
                        <React.Fragment>
                            {currentScreen === 0 && renderIntroScreen()}
                            {currentScreen === 1 && renderOnboardingScreen()}
                            {currentScreen === 2 && renderMedicalScreen()}
                            {currentScreen === 3 && renderPsychologyScreen()}
                            {currentScreen === 4 && renderReviewScreen()}
                            {currentScreen === 5 && renderSuccessScreen()}
                            {currentScreen === 6 && renderDashboardScreen()}
                            {currentScreen === 7 && renderProfileScreen()}
                            {currentScreen === 8 && renderSettingsScreen()}
                            {currentScreen === 9 && renderAIChatScreen()}
                            {currentScreen === 10 && renderDailyCheckInScreen()}
                            {currentScreen === 11 && renderBodyMapScreen()}
                        </React.Fragment>
                    )}
                    {reportOpen && renderReportModal()}
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
