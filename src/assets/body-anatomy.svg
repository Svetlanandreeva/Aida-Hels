<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <defs>
    <!-- Background Glow & Body Gradients -->
    <linearGradient id="bodyOutlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8968FF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#4F8CFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#47D8FF" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="bodyFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192348" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#0F1735" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0A0E24" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45CFF" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#47D8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#65F4C0" stop-opacity="0.7" />
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#47D8FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8968FF" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <ellipse cx="200" cy="400" rx="140" ry="340" fill="url(#glowPulse)" opacity="0.35" />

  <!-- Detailed Realistic Anatomical Human Silhouette -->
  <!-- Head & Skull Contour -->
  <g filter="url(#softGlow)">
    <!-- Skull / Head contour -->
    <path d="M 200,60 
             C 178,60 162,76 162,100 
             C 162,120 172,138 184,148 
             C 188,152 192,158 193,164 
             L 200,165 
             L 207,164 
             C 208,158 212,152 216,148 
             C 228,138 238,120 238,100 
             C 238,76 222,60 200,60 Z" 
          fill="url(#bodyFillGrad)" 
          stroke="url(#bodyOutlineGrad)" 
          stroke-width="2.2" />

    <!-- Neck & Trapezius -->
    <path d="M 188,155 
             C 182,175 160,188 138,200 
             L 125,206 
             C 115,212 110,222 112,235 
             L 120,330 
             L 105,430 
             L 98,520 
             C 96,540 92,580 94,620 
             L 108,740 
             C 110,755 125,760 135,758 
             C 145,756 152,740 152,720 
             L 155,590 
             L 175,480 
             L 200,450 
             L 225,480 
             L 245,590 
             L 248,720 
             C 248,740 255,756 265,758 
             C 275,760 290,755 292,740 
             L 306,620 
             C 308,580 304,540 302,520 
             L 295,430 
             L 280,330 
             L 288,235 
             C 290,222 285,212 275,206 
             L 262,200 
             C 240,188 218,175 212,155 Z" 
          fill="url(#bodyFillGrad)" 
          stroke="url(#bodyOutlineGrad)" 
          stroke-width="2.2" />

    <!-- Arms (Left and Right) -->
    <!-- Left Arm & Hand -->
    <path d="M 125,206 
             C 110,215 95,240 88,280 
             C 82,320 78,370 72,420 
             C 68,450 62,480 58,505 
             C 56,515 48,525 54,535 
             C 60,542 68,532 72,520 
             C 78,490 85,440 92,390 
             C 98,340 105,290 115,240 Z" 
          fill="url(#bodyFillGrad)" 
          stroke="url(#bodyOutlineGrad)" 
          stroke-width="1.8" />

    <!-- Right Arm & Hand -->
    <path d="M 275,206 
             C 290,215 305,240 312,280 
             C 318,320 322,370 328,420 
             C 332,450 338,480 342,505 
             C 344,515 352,525 346,535 
             C 340,542 332,532 328,520 
             C 322,490 315,440 308,390 
             C 302,340 295,290 285,240 Z" 
          fill="url(#bodyFillGrad)" 
          stroke="url(#bodyOutlineGrad)" 
          stroke-width="1.8" />
  </g>

  <!-- Internal Anatomical Structures (Ribcage, Pelvic Arch, Spine Central Line) -->
  <g opacity="0.45" stroke="#47D8FF" stroke-width="1" fill="none">
    <!-- Spine Line -->
    <path d="M 200,165 L 200,450" stroke="url(#spineGrad)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Ribcage outline -->
    <path d="M 160,230 C 180,220 220,220 240,230" />
    <path d="M 152,250 C 180,240 220,240 248,250" />
    <path d="M 148,270 C 180,260 220,260 252,270" />
    <path d="M 146,290 C 180,280 220,280 254,290" />
    <path d="M 150,310 C 180,305 220,305 250,310" />

    <!-- Pelvic Arch -->
    <path d="M 160,400 C 180,430 220,430 240,400" stroke-width="1.5" />
    <path d="M 175,440 L 200,410 L 225,440" stroke-width="1.5" />
  </g>

  <!-- System Target Pulse Aura Nodes (Subtle, Non-Cluttered) -->
  <!-- Brain / Neuro Node (Head) -->
  <g id="node-neuro" class="system-node" opacity="0.85">
    <circle cx="200" cy="102" r="18" fill="#8968FF" opacity="0.25" filter="url(#softGlow)" />
    <circle cx="200" cy="102" r="6" fill="#B45CFF" />
    <circle cx="200" cy="102" r="2" fill="#FFFFFF" />
  </g>

  <!-- Endocrine Node (Thyroid / Throat area) -->
  <g id="node-endocrine" class="system-node" opacity="0.85">
    <circle cx="200" cy="160" r="12" fill="#FF8A65" opacity="0.25" filter="url(#softGlow)" />
    <circle cx="200" cy="160" r="4" fill="#FF8A65" />
  </g>

  <!-- Heart / Cardio Node (Chest left) -->
  <g id="node-cardio" class="system-node" opacity="0.9">
    <circle cx="216" cy="242" r="22" fill="#FF6685" opacity="0.3" filter="url(#strongGlow)" />
    <circle cx="216" cy="242" r="8" fill="#FF6685" />
    <circle cx="216" cy="242" r="3" fill="#FFFFFF" />
  </g>

  <!-- Immune / Lymphatic Node (Upper chest/Thymus area) -->
  <g id="node-immune" class="system-node" opacity="0.85">
    <circle cx="185" cy="225" r="14" fill="#47D8FF" opacity="0.25" filter="url(#softGlow)" />
    <circle cx="185" cy="225" r="5" fill="#47D8FF" />
  </g>

  <!-- Digestive / Gastro Node (Abdomen) -->
  <g id="node-gastro" class="system-node" opacity="0.85">
    <circle cx="200" cy="330" r="24" fill="#FFB957" opacity="0.25" filter="url(#softGlow)" />
    <circle cx="200" cy="330" r="7" fill="#FFB957" />
  </g>

  <!-- Locomotor / Musculoskeletal Node (Joints: Knees & Spine) -->
  <g id="node-locomotor" class="system-node" opacity="0.8">
    <circle cx="148" cy="560" r="10" fill="#65F4C0" opacity="0.3" filter="url(#softGlow)" />
    <circle cx="148" cy="560" r="4" fill="#65F4C0" />
    <circle cx="252" cy="560" r="10" fill="#65F4C0" opacity="0.3" filter="url(#softGlow)" />
    <circle cx="252" cy="560" r="4" fill="#65F4C0" />
  </g>
</svg>
