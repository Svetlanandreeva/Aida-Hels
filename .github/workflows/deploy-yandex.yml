name: Deploy Aida 2 to Yandex Cloud

on:
  push:
    branches: [migration/aida2]
  workflow_dispatch: {}

env:
  YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
  IMAGE_NAME: helt-aida
  GOOGLE_SPREADSHEET_ID: 19IZzlVKdHaZ7Sbp0OhRQ7am9uSiYaT3hR4_cnN7QVtw
  GOOGLE_DRIVE_FOLDER_ID: 1WwLap-Mv5casqk7TNUq3Nfq_ZIBn_jC5

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Prepare Google runtime credential
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          encoded=$(printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" | base64 -w0)
          echo "::add-mask::$encoded"
          echo "GOOGLE_SERVICE_ACCOUNT_B64=$encoded" >> "$GITHUB_ENV"

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build Aida 2 web image
        run: |
          docker build -t cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Smoke-test built container with Google storage
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker rm -f aida-smoke >/dev/null 2>&1 || true
          docker run -d --name aida-smoke -p 18080:8080 \
            -e GOOGLE_SERVICE_ACCOUNT_B64="$GOOGLE_SERVICE_ACCOUNT_B64" \
            -e GOOGLE_SPREADSHEET_ID="$GOOGLE_SPREADSHEET_ID" \
            -e GOOGLE_DRIVE_FOLDER_ID="$GOOGLE_DRIVE_FOLDER_ID" \
            "$IMAGE"

          healthy=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/tmp/aida-health.json; then
              healthy=1
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx aida-smoke; then
              break
            fi
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            echo 'Container smoke test failed. Runtime logs:'
            docker logs aida-smoke || true
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:18080/api/profiles >/tmp/aida-profiles.json
          docker rm -f aida-smoke >/dev/null

      - name: Push image
        run: |
          docker push cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy revision to Serverless Container
        id: deploy
        uses: yc-actions/yc-sls-container-deploy@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: ${{ env.YC_FOLDER_ID }}
          container-name: helt-aida
          revision-image-url: cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-concurrency: 16
          revision-execution-timeout: 30
          revision-service-account-id: ${{ secrets.YC_SA_ID }}
          revision-env: |
            GOOGLE_SERVICE_ACCOUNT_B64=${{ env.GOOGLE_SERVICE_ACCOUNT_B64 }}
            GOOGLE_SPREADSHEET_ID=${{ env.GOOGLE_SPREADSHEET_ID }}
            GOOGLE_DRIVE_FOLDER_ID=${{ env.GOOGLE_DRIVE_FOLDER_ID }}
            AIDA_SEED_DEMO=0
          public: true

      - name: Verify deployed Aida 2 responds
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ steps.deploy.outputs.id }}.containers.yandexcloud.net"
          echo "Checking Aida deployment"
          for attempt in $(seq 1 30); do
            code=$(curl --silent --show-error --output /tmp/deployed-response.json --write-out '%{http_code}' "$URL/healthz" || true)
            if [[ "$code" =~ ^[23][0-9]{2}$ ]]; then
              curl --fail --silent --show-error "$URL/api/profiles" >/tmp/deployed-profiles.json
              echo 'Aida 2 deployment and Google-backed API are healthy.'
              exit 0
            fi
            sleep 2
          done
          echo 'Deployed container did not become healthy.'
          cat /tmp/deployed-response.json || true
          exit 1
