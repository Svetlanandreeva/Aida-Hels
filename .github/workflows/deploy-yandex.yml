name: Legacy Yandex deploy (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm_legacy:
        description: 'Deploy the legacy root Vite/Express application instead of consolidated Aida2'
        required: true
        default: false
        type: boolean

env:
  YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
  IMAGE_NAME: helt-aida

jobs:
  build-and-deploy:
    if: ${{ inputs.confirm_legacy == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Explain legacy target
        run: |
          echo 'WARNING: this workflow deploys the legacy root Vite/Express stack.'
          echo 'The consolidated Expo + Python Aida2 production path is Deploy to RU VDS.'

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build legacy image
        run: |
          docker build -t cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Smoke-test built container
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PROXY_URL: ${{ secrets.GEMINI_PROXY_URL }}
          GEMINI_PROXY_SECRET: ${{ secrets.GEMINI_PROXY_SECRET }}
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          IMAGE="cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker rm -f aida-smoke >/dev/null 2>&1 || true
          docker run --rm "$IMAGE" node -e "require.resolve('@yandex-cloud/nodejs-sdk/dist/token-service/metadata-token-service')"
          docker run -d --name aida-smoke -p 18080:8080 \
            -e NODE_ENV=production -e GEMINI_API_KEY -e GEMINI_PROXY_URL \
            -e GEMINI_PROXY_SECRET -e GOOGLE_SHEETS_WEB_APP_URL -e JWT_SECRET "$IMAGE"
          healthy=0
          consecutive=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >/tmp/aida-smoke-response.html \
              && grep -q 'id="root"' /tmp/aida-smoke-response.html \
              && grep -q '<script' /tmp/aida-smoke-response.html; then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then healthy=1; break; fi
            else
              consecutive=0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx aida-smoke; then break; fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            docker logs aida-smoke || true
            exit 1
          fi
          docker rm -f aida-smoke >/dev/null

      - name: Push image
        run: |
          docker push cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy revision to Serverless Container
        id: deploy
        uses: yc-actions/yc-sls-container-deploy@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: ${{ env.YC_FOLDER_ID }}
          container-name: helt-aida
          revision-image-url: cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-concurrency: 8
          revision-execution-timeout: 60
          revision-service-account-id: ${{ secrets.YC_SA_ID }}
          revision-env: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GEMINI_PROXY_URL=${{ secrets.GEMINI_PROXY_URL }}
            GEMINI_PROXY_SECRET=${{ secrets.GEMINI_PROXY_SECRET }}
            GOOGLE_SHEETS_WEB_APP_URL=${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
            YDB_ENDPOINT=${{ secrets.YDB_ENDPOINT }}
            YDB_DATABASE=${{ secrets.YDB_DATABASE }}
            YDB_SA_JSON_CREDENTIALS=${{ secrets.YDB_SA_JSON_CREDENTIALS }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            NODE_ENV=production
          public: true

      - name: Verify deployed container responds
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ steps.deploy.outputs.id }}.containers.yandexcloud.net/"
          for attempt in $(seq 1 30); do
            code=$(curl --silent --show-error --output /tmp/deployed-response.txt --write-out '%{http_code}' "$URL" || true)
            if [[ "$code" =~ ^[23][0-9]{2}$ ]] && grep -q 'id="root"' /tmp/deployed-response.txt; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/deployed-response.txt || true
          exit 1
