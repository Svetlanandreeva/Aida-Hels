name: Validate ICD-10 medical onboarding

on:
  push:
    branches: [feat/icd10-medical-onboarding]
    paths:
      - '.github/workflows/validate-icd10-medical-onboarding.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Prepare Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Validate feature
        id: validate
        shell: bash
        run: |
          set +e
          mkdir -p ops
          result=ops/icd10-medical-onboarding-validation.txt
          : > "$result"
          status=0

          run_check() {
            name="$1"
            shift
            echo "== $name =="
            "$@"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "$name=success" >> "$result"
            else
              echo "$name=failure:$rc" >> "$result"
              status=1
            fi
          }

          cd frontend
          run_check yarn_install yarn install --frozen-lockfile --non-interactive --network-timeout 60000
          run_check frontend_lint yarn lint
          run_check frontend_typecheck npx --no-install tsc -p tsconfig.deploy.json --pretty false
          run_check frontend_export npx --no-install expo export --platform web
          cd ..

          run_check backend_compile python -m py_compile backend/main.py backend/profile_api.py backend/icd10_api.py backend/ai_context.py
          run_check backend_security python -m pytest backend/security_tests -q

          if [ "$status" -eq 0 ]; then
            echo 'validation_status=success' >> "$result"
          else
            echo 'validation_status=failure' >> "$result"
          fi
          cat "$result"
          exit "$status"

      - name: Persist validation summary
        if: always()
        run: |
          set -euo pipefail
          test -f ops/icd10-medical-onboarding-validation.txt || printf 'validation_status=workflow_error\n' > ops/icd10-medical-onboarding-validation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/icd10-medical-onboarding-validation.txt
          git commit -m 'Record ICD-10 onboarding validation result' || exit 0
          git push origin HEAD:feat/icd10-medical-onboarding
