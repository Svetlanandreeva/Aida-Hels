name: Validate Android Health Connect

# Native Android compilation remains a real release gate, but it requires a
# GitHub-hosted runner. Keep it explicit/manual while hosted minutes are
# unavailable instead of creating automatic failures before a runner starts.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --clean --platform android --no-install
      - name: Verify local Expo module was autolinked
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npx expo-modules-autolinking resolve --platform android | tee /tmp/autolinking.json
          grep -q 'aida-health-connect' /tmp/autolinking.json
      - name: Compile Android app with Health Connect bridge
        working-directory: frontend/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
