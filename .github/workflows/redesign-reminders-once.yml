name: Apply reminder redesign once

on:
  push:
    branches: [main]
    paths:
      - scripts/redesign-reminders.mjs
      - .github/workflows/redesign-reminders-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch-reminders:
    if: ${{ !contains(github.event.head_commit.message || '', '[reminders-redesigned]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply reminder redesign
        run: node scripts/redesign-reminders.mjs

      - name: Commit redesigned reminder screen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RemindersScreen.tsx
          if git diff --cached --quiet; then
            echo "No reminder changes to commit."
            exit 0
          fi
          git commit -m "style(reminders): rebuild medication reminders [reminders-redesigned]"
          git push
