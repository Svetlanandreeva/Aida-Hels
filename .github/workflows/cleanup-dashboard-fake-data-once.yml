name: Cleanup dashboard fake data once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-dashboard-fake-data-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove fake defaults and sanitize upload status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Dashboard.tsx')
          s = p.read_text()

          old = """  // Calculate completeness score\n  const completeness = 92;\n\n  // Women Health calculation\n  const getCycleDaysLeft = () => {\n    if (!user.womenHealth) return null;\n    const last = new Date(user.womenHealth.lastPeriodDate);\n    const now = new Date('2026-08-01');\n    const diffDays = Math.floor((now.getTime() - last.getTime()) / (1000 * 3600 * 24));\n    const daysLeft = user.womenHealth.cycleLength - (diffDays % user.womenHealth.cycleLength);\n    return daysLeft > 0 ? daysLeft : 1;\n  };\n\n"""
          if old not in s:
              raise SystemExit('expected fake completeness/cycle block not found')
          s = s.replace(old, '')

          s = s.replace("setUploadStatusStep('Проверка формата, размер (макс 15МБ) и хеширование...');", "setUploadStatusStep('Подготавливаем документ...');")
          s = s.replace("""      const record = await processLabDocumentThroughStaging(file, (step, percent) => {\n        setUploadStatusStep(step);\n        setUploadProgress(percent);\n      });""", """      const record = await processLabDocumentThroughStaging(file, (step, percent) => {\n        const publicStep = /ocr|распозн|считыв/i.test(step)\n          ? 'Считываем данные...'\n          : /marker|показател|анализ/i.test(step)\n            ? 'Разбираем показатели...'\n            : 'Обрабатываем документ...';\n        setUploadStatusStep(publicStep);\n        setUploadProgress(percent);\n      });""")
          s = s.replace("""      const errMsg = err?.message || 'Не удалось сопоставить документ в пайплайне';\n      setUploadError(errMsg);""", """      setUploadError('Не удалось обработать документ. Проверьте файл и попробуйте ещё раз.');""")

          p.write_text(s)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "Svetlana Andreeva"
          git config user.email "AnbreevaSveta@yandex.ru"
          git add src/components/Dashboard.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(data): remove fake dashboard values and sanitize lab upload states"
          git push origin main
