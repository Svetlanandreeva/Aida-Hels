name: Remove demo auth source

on:
  push:
    branches: [main]
    paths:
      - 'scripts/remove-demo-auth-source.mjs'
      - '.github/workflows/remove-demo-auth-source.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove demo and guest auth from source
        run: node scripts/remove-demo-auth-source.mjs
      - name: Verify forbidden auth markers are gone
        run: |
          ! grep -q "anna.ivanova@health.ru" server.ts
          ! grep -q "demo1234" server.ts
          ! grep -q "id: 'usr-1'" server.ts
      - name: Commit source cleanup
        run: |
          if git diff --quiet -- server.ts; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix(auth): remove demo user and guest fallback from source"
          git push origin main
