name: Deploy to RU VDS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'ios/**'
      - 'android/**'
      - '.github/workflows/deploy-ruvds.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ruvds-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, x64, aida-prod]
    timeout-minutes: 60
    env:
      RUVDS_HOST: ${{ secrets.RUVDS_HOST }}
      RUVDS_USER: ${{ secrets.RUVDS_USER }}
      RUVDS_PORT: ${{ secrets.RUVDS_PORT }}
      CI: '1'
    steps:
      - name: Checkout production revision
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        env:
          RUVDS_SSH_KEY: ${{ secrets.RUVDS_SSH_KEY }}
          RUVDS_SSH_KNOWN_HOSTS: ${{ secrets.RUVDS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$RUVDS_HOST" || (echo 'RUVDS_HOST secret is missing' && exit 1)
          test -n "$RUVDS_USER" || (echo 'RUVDS_USER secret is missing' && exit 1)
          test -n "$RUVDS_SSH_KEY" || (echo 'RUVDS_SSH_KEY secret is missing' && exit 1)
          test -n "$RUVDS_SSH_KNOWN_HOSTS" || (echo 'RUVDS_SSH_KNOWN_HOSTS secret is missing' && exit 1)
          test -n "$RUVDS_PORT" || (echo 'RUVDS_PORT secret is missing' && exit 1)

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Prepare Yarn
        timeout-minutes: 2
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version
          node --version

      - name: Install frontend dependencies
        timeout-minutes: 12
        working-directory: frontend
        env:
          YARN_NETWORK_CONCURRENCY: '1'
        run: yarn install --frozen-lockfile --non-interactive --prefer-offline --network-timeout 60000

      - name: Lint frontend
        timeout-minutes: 5
        working-directory: frontend
        run: yarn lint

      - name: Report runner memory before TypeScript validation
        run: |
          free -h || true
          swapon --show || true

      - name: Type-check application code in bounded low-memory mode
        timeout-minutes: 5
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=384'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 240s npx --no-install tsc -p tsconfig.deploy.json --pretty false

      - name: Report runner memory before Expo export
        run: |
          free -h || true
          swapon --show || true

      - name: Export Expo web frontend in low-memory mode
        timeout-minutes: 20
        working-directory: frontend
        env:
          EXPO_NO_TELEMETRY: '1'
          NODE_OPTIONS: '--max-old-space-size=640'
        run: |
          npx --no-install expo export -p web --max-workers 1
          test -f dist/index.html
          test -d dist/_expo

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate backend before deployment
        timeout-minutes: 10
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pip install -q -r requirements.txt
          python -m compileall -q .
          python -c "import main; assert main.app is not None"
          pytest -q security_tests

      - name: Prepare pinned SSH identity
        env:
          RUVDS_SSH_KEY: ${{ secrets.RUVDS_SSH_KEY }}
          RUVDS_SSH_KNOWN_HOSTS: ${{ secrets.RUVDS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          python3 - <<'PY'
          import base64
          import os
          import re
          import textwrap
          from pathlib import Path

          raw = os.environ['RUVDS_SSH_KEY'].strip()
          key = raw.replace('\\n', '\n').replace('\r\n', '\n').replace('\r', '\n').strip()
          if '-----BEGIN ' not in key:
              try:
                  decoded = base64.b64decode(key, validate=True).decode('utf-8').strip()
                  if '-----BEGIN ' in decoded:
                      key = decoded
              except Exception:
                  pass
          match = re.search(r'(-----BEGIN [^-]+-----)(.*?)(-----END [^-]+-----)', key, flags=re.S)
          if match:
              begin, body, end = match.groups()
              compact = re.sub(r'\s+', '', body)
              if compact:
                  key = begin + '\n' + '\n'.join(textwrap.wrap(compact, 70)) + '\n' + end
          Path.home().joinpath('.ssh/ruvds').write_text(key + '\n')
          Path.home().joinpath('.ssh/known_hosts').write_text(os.environ['RUVDS_SSH_KNOWN_HOSTS'].strip() + '\n')
          PY
          chmod 600 ~/.ssh/ruvds ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/ruvds >/dev/null

      - name: Verify restricted production access
        timeout-minutes: 2
        run: |
          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RUVDS_USER@$RUVDS_HOST" \
            'set -e; test -w /opt/aida/backend; test -w /opt/aida/frontend; sudo -n /usr/bin/systemctl status aida-backend >/dev/null'

      - name: Upload application sources
        timeout-minutes: 5
        run: |
          SSH="ssh -p $RUVDS_PORT -i ~/.ssh/ruvds -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          $SSH "$RUVDS_USER@$RUVDS_HOST" <<'EOF'
          set -euo pipefail
          find /opt/aida/backend -mindepth 1 -maxdepth 1 ! -name '.env' ! -name '.venv' -exec rm -rf -- {} +
          find /opt/aida/frontend -mindepth 1 -maxdepth 1 ! -name 'node_modules' -exec rm -rf -- {} +
          EOF

          tar -C backend --exclude='.env' --exclude='.venv' --exclude='node_modules' --exclude='.git' -czf - . | \
            $SSH "$RUVDS_USER@$RUVDS_HOST" 'tar -xzf - -C /opt/aida/backend'
          tar -C frontend --exclude='node_modules' --exclude='.git' -czf - . | \
            $SSH "$RUVDS_USER@$RUVDS_HOST" 'tar -xzf - -C /opt/aida/frontend'

      - name: Ensure persistent production auth secret
        timeout-minutes: 2
        run: |
          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RUVDS_USER@$RUVDS_HOST" <<'EOF'
          set -euo pipefail
          cd /opt/aida/backend
          touch .env
          test -w .env || (echo 'Production .env is not writable by deploy user' && exit 1)
          chmod 600 .env
          python3 - <<'PY'
          from pathlib import Path
          import secrets

          path = Path('.env')
          lines = path.read_text().splitlines()
          existing = None
          for line in lines:
              if line.startswith('JWT_SECRET='):
                  existing = line.split('=', 1)[1].strip()
                  break

          if existing and len(existing) >= 32:
              print('JWT_SECRET is already configured; preserving existing value.')
          else:
              generated = secrets.token_hex(32)
              updated = []
              replaced = False
              for line in lines:
                  if line.startswith('JWT_SECRET='):
                      if not replaced:
                          updated.append(f'JWT_SECRET={generated}')
                          replaced = True
                      continue
                  updated.append(line)
              if not replaced:
                  if updated and updated[-1] != '':
                      updated.append('')
                  updated.append(f'JWT_SECRET={generated}')
              path.write_text('\n'.join(updated).rstrip() + '\n')
              print('JWT_SECRET was missing or invalid and has been generated once for this server.')
          PY
          EOF

      - name: Restart backend and verify production
        timeout-minutes: 5
        run: |
          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RUVDS_USER@$RUVDS_HOST" <<'EOF'
          set -euo pipefail
          cd /opt/aida/backend
          if [ ! -x .venv/bin/python ]; then
            python3 -m venv .venv
          fi
          .venv/bin/python -m pip install -q -r requirements.txt
          sudo -n /usr/bin/systemctl restart aida-backend

          for attempt in 1 2 3 4 5 6; do
            sleep 2
            if curl --fail --silent http://127.0.0.1:8000/api/ | grep -q '"status":"ok"'; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo 'Backend health check failed after restart.'
              sudo -n /usr/bin/systemctl status aida-backend --no-pager || true
              exit 1
            fi
          done

          curl --fail --silent --head --resolve aidaassistent.ru:443:127.0.0.1 https://aidaassistent.ru/ >/dev/null
          EOF

      - name: Deployment summary
        run: echo 'Aida production validated and deployed through the self-hosted aida-prod runner in low-memory mode.'
