name: Deploy to RU VDS

on:
  workflow_run:
    workflows: ['Validate consolidated Aida2']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-ruvds-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Rebuild approved Expo web frontend
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn lint
          npx tsc --noEmit
          npx expo export -p web
          test -f dist/index.html

      - name: Prepare SSH
        env:
          RUVDS_SSH_KEY: ${{ secrets.RUVDS_SSH_KEY }}
        run: |
          test -n "$RUVDS_SSH_KEY" || (echo 'RUVDS_SSH_KEY secret is missing' && exit 1)
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import base64
          import os
          import re
          import textwrap
          from pathlib import Path

          raw = os.environ['RUVDS_SSH_KEY'].strip()
          key = raw.replace('\\n', '\n').replace('\r\n', '\n').replace('\r', '\n').strip()

          # Accept a base64-encoded complete private key as a safe single-line secret.
          if '-----BEGIN ' not in key:
              try:
                  decoded = base64.b64decode(key, validate=True).decode('utf-8').strip()
                  if '-----BEGIN ' in decoded:
                      key = decoded
              except Exception:
                  pass

          # Recover keys pasted into GitHub as one line with whitespace in the
          # base64 body while preserving the BEGIN/END markers.
          match = re.search(
              r'(-----BEGIN [^-]+-----)(.*?)(-----END [^-]+-----)',
              key,
              flags=re.S,
          )
          if match:
              begin, body, end = match.groups()
              compact = re.sub(r'\s+', '', body)
              if compact:
                  key = begin + '\n' + '\n'.join(textwrap.wrap(compact, 70)) + '\n' + end

          Path.home().joinpath('.ssh/ruvds').write_text(key + '\n')
          PY
          chmod 600 ~/.ssh/ruvds
          ssh-keygen -y -f ~/.ssh/ruvds >/dev/null || (echo 'RUVDS_SSH_KEY is not a valid private key after normalization' && exit 1)
          ssh-keyscan -H 170.168.1.118 >> ~/.ssh/known_hosts

      - name: Upload application sources
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.venv' \
            --exclude 'node_modules' \
            --exclude '.git' \
            -e 'ssh -i ~/.ssh/ruvds -o IdentitiesOnly=yes' \
            backend/ root@170.168.1.118:/opt/aida/backend/

          rsync -az --delete \
            --exclude 'node_modules' \
            -e 'ssh -i ~/.ssh/ruvds -o IdentitiesOnly=yes' \
            frontend/ root@170.168.1.118:/opt/aida/frontend/

      - name: Restart backend and verify production
        run: |
          ssh -i ~/.ssh/ruvds -o IdentitiesOnly=yes root@170.168.1.118 <<'EOF'
          set -euo pipefail
          chown -R aida:aida /opt/aida/backend /opt/aida/frontend
          cd /opt/aida/backend
          if [ ! -x .venv/bin/python ]; then
            python3 -m venv .venv
          fi
          .venv/bin/python -m pip install -q -r requirements.txt
          systemctl restart aida-backend
          systemctl reload nginx
          sleep 2
          systemctl is-active --quiet aida-backend
          curl --fail --silent http://127.0.0.1:8000/api/ | grep -q '"status":"ok"'
          curl --fail --silent --head http://127.0.0.1/ >/dev/null
          EOF

      - name: Deployment summary
        run: echo 'Validated RU VDS deployment and smoke checks passed.'
