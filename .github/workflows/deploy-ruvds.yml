name: Deploy to RU VDS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'ios/**'
      - 'android/**'
      - '.github/workflows/deploy-ruvds.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ruvds-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUVDS_HOST: ${{ secrets.RUVDS_HOST }}
      RUVDS_USER: ${{ secrets.RUVDS_USER }}
      RUVDS_PORT: ${{ secrets.RUVDS_PORT }}
      CI: '1'
    steps:
      - name: Checkout production revision
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        env:
          RUVDS_SSH_KEY: ${{ secrets.RUVDS_SSH_KEY }}
          RUVDS_SSH_KNOWN_HOSTS: ${{ secrets.RUVDS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$RUVDS_HOST" || (echo 'RUVDS_HOST secret is missing' && exit 1)
          test -n "$RUVDS_USER" || (echo 'RUVDS_USER secret is missing' && exit 1)
          test -n "$RUVDS_SSH_KEY" || (echo 'RUVDS_SSH_KEY secret is missing' && exit 1)
          test -n "$RUVDS_SSH_KNOWN_HOSTS" || (echo 'RUVDS_SSH_KNOWN_HOSTS secret is missing' && exit 1)
          test -n "$RUVDS_PORT" || (echo 'RUVDS_PORT secret is missing' && exit 1)

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Prepare Yarn
        timeout-minutes: 2
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version
          node --version

      - name: Install frontend dependencies
        timeout-minutes: 12
        working-directory: frontend
        env:
          YARN_NETWORK_CONCURRENCY: '1'
        run: yarn install --frozen-lockfile --non-interactive --network-timeout 60000

      - name: Lint frontend
        timeout-minutes: 5
        working-directory: frontend
        run: yarn lint

      - name: Type-check application
        timeout-minutes: 5
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
        run: npx --no-install tsc -p tsconfig.deploy.json --pretty false

      - name: Export Expo web frontend
        timeout-minutes: 20
        working-directory: frontend
        env:
          EXPO_NO_TELEMETRY: '1'
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: |
          npx --no-install expo export -p web
          cp public/aida-logo.svg dist/aida-logo.svg
          test -f dist/index.html
          test -d dist/_expo
          test -s dist/aida-logo.svg

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate backend before deployment
        timeout-minutes: 10
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pip install -q -r requirements.txt
          python -m compileall -q .
          python -c "import main; assert main.app is not None"
          pytest -q security_tests

      - name: Prepare pinned SSH identity
        env:
          RUVDS_SSH_KEY: ${{ secrets.RUVDS_SSH_KEY }}
          RUVDS_SSH_KNOWN_HOSTS: ${{ secrets.RUVDS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RUVDS_SSH_KEY" > ~/.ssh/ruvds
          printf '%s\n' "$RUVDS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ruvds ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/ruvds >/dev/null

      - name: Verify production access
        timeout-minutes: 2
        run: |
          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RUVDS_USER@$RUVDS_HOST" \
            'set -e; test -w /opt/aida/backend; test -w /opt/aida/web; sudo -n /usr/bin/systemctl status aida-backend >/dev/null'

      - name: Ensure persistent social OAuth configuration
        timeout-minutes: 2
        env:
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
        run: |
          YANDEX_CLIENT_ID_B64="$(printf '%s' "$YANDEX_CLIENT_ID" | base64 | tr -d '\n')"
          YANDEX_CLIENT_SECRET_B64="$(printf '%s' "$YANDEX_CLIENT_SECRET" | base64 | tr -d '\n')"
          VK_CLIENT_ID_B64="$(printf '%s' "$VK_CLIENT_ID" | base64 | tr -d '\n')"
          VK_CLIENT_SECRET_B64="$(printf '%s' "$VK_CLIENT_SECRET" | base64 | tr -d '\n')"

          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$RUVDS_USER@$RUVDS_HOST" bash -s -- \
            "$YANDEX_CLIENT_ID_B64" "$YANDEX_CLIENT_SECRET_B64" "$VK_CLIENT_ID_B64" "$VK_CLIENT_SECRET_B64" <<'EOF'
          set -euo pipefail
          cd /opt/aida/backend
          touch .env
          test -w .env || (echo 'Production .env is not writable by deploy user' && exit 1)
          chmod 600 .env

          export YANDEX_CLIENT_ID_B64="$1"
          export YANDEX_CLIENT_SECRET_B64="$2"
          export VK_CLIENT_ID_B64="$3"
          export VK_CLIENT_SECRET_B64="$4"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('.env')
          lines = path.read_text().splitlines()

          def current_values():
              values = {}
              for line in lines:
                  if not line or line.lstrip().startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  values[key.strip()] = value.strip()
              return values

          def incoming(name):
              encoded = os.environ.get(f'{name}_B64', '')
              if not encoded:
                  return ''
              return base64.b64decode(encoded.encode('ascii')).decode('utf-8').strip()

          existing = current_values()
          managed = {
              'YANDEX_CLIENT_ID': incoming('YANDEX_CLIENT_ID') or existing.get('YANDEX_CLIENT_ID', ''),
              'YANDEX_CLIENT_SECRET': incoming('YANDEX_CLIENT_SECRET') or existing.get('YANDEX_CLIENT_SECRET', ''),
              'VK_CLIENT_ID': incoming('VK_CLIENT_ID') or existing.get('VK_CLIENT_ID', ''),
              'VK_CLIENT_SECRET': incoming('VK_CLIENT_SECRET') or existing.get('VK_CLIENT_SECRET', ''),
              'YANDEX_REDIRECT_URI': 'https://aidaassistent.ru/api/auth/oauth/yandex/callback',
              'VK_REDIRECT_URI': 'https://aidaassistent.ru/api/auth/oauth/vk/callback',
              'OAUTH_ALLOWED_RETURN_URIS': 'https://aidaassistent.ru/auth',
          }

          required = ('YANDEX_CLIENT_ID', 'YANDEX_CLIENT_SECRET', 'VK_CLIENT_ID', 'VK_CLIENT_SECRET')
          missing = [key for key in required if not managed[key]]
          if missing:
              print('Social OAuth production configuration is incomplete: ' + ', '.join(missing))
              print('Add the missing values to GitHub Actions secrets or the persistent /opt/aida/backend/.env file.')
              raise SystemExit(1)

          updated = []
          seen = set()
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  key = line.split('=', 1)[0].strip()
                  if key in managed:
                      if key not in seen:
                          updated.append(f'{key}={managed[key]}')
                          seen.add(key)
                      continue
              updated.append(line)

          for key, value in managed.items():
              if key not in seen:
                  if updated and updated[-1] != '':
                      updated.append('')
                  updated.append(f'{key}={value}')

          path.write_text('\n'.join(updated).rstrip() + '\n')
          print('Yandex ID and VK ID production configuration is present and persisted.')
          PY
          EOF

      - name: Upload backend and built web bundle
        timeout-minutes: 8
        run: |
          SSH="ssh -p $RUVDS_PORT -i ~/.ssh/ruvds -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          $SSH "$RUVDS_USER@$RUVDS_HOST" <<'EOF'
          set -euo pipefail
          find /opt/aida/backend -mindepth 1 -maxdepth 1 ! -name '.env' ! -name '.venv' -exec rm -rf -- {} +
          find /opt/aida/web -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          EOF

          tar -C backend --exclude='.env' --exclude='.venv' --exclude='node_modules' --exclude='.git' -czf - . | \
            $SSH "$RUVDS_USER@$RUVDS_HOST" 'tar -xzf - -C /opt/aida/backend'

          tar -C frontend/dist -czf - . | \
            $SSH "$RUVDS_USER@$RUVDS_HOST" 'tar -xzf - -C /opt/aida/web'

          $SSH "$RUVDS_USER@$RUVDS_HOST" 'test -s /opt/aida/web/index.html'

      - name: Ensure persistent production auth secret
        timeout-minutes: 2
        run: |
          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RUVDS_USER@$RUVDS_HOST" <<'EOF'
          set -euo pipefail
          cd /opt/aida/backend
          touch .env
          test -w .env || (echo 'Production .env is not writable by deploy user' && exit 1)
          chmod 600 .env
          python3 - <<'PY'
          from pathlib import Path
          import secrets

          path = Path('.env')
          lines = path.read_text().splitlines()
          existing = None
          for line in lines:
              if line.startswith('JWT_SECRET='):
                  existing = line.split('=', 1)[1].strip()
                  break

          if existing and len(existing) >= 32:
              print('JWT_SECRET is already configured; preserving existing value.')
          else:
              generated = secrets.token_hex(32)
              updated = []
              replaced = False
              for line in lines:
                  if line.startswith('JWT_SECRET='):
                      if not replaced:
                          updated.append(f'JWT_SECRET={generated}')
                          replaced = True
                      continue
                  updated.append(line)
              if not replaced:
                  if updated and updated[-1] != '':
                      updated.append('')
                  updated.append(f'JWT_SECRET={generated}')
              path.write_text('\n'.join(updated).rstrip() + '\n')
              print('JWT_SECRET was missing or invalid and has been generated once for this server.')
          PY
          EOF

      - name: Restart backend and verify production
        timeout-minutes: 8
        run: |
          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RUVDS_USER@$RUVDS_HOST" <<'EOF'
          set -euo pipefail
          cd /opt/aida/backend
          if [ ! -x .venv/bin/python ]; then
            python3 -m venv .venv
          fi
          .venv/bin/python -m pip install -q -r requirements.txt
          sudo -n /usr/bin/systemctl restart aida-backend

          for attempt in 1 2 3 4 5 6 7 8; do
            sleep 2
            if curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo 'Backend check failed after restart.'
              sudo -n /usr/bin/systemctl status aida-backend --no-pager || true
              exit 1
            fi
          done

          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/auth/me)" = "401"
          curl --fail --silent http://127.0.0.1:8000/api/auth/oauth/providers | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("yandex", {}).get("configured") is True; assert data.get("vk", {}).get("configured") is True'
          curl --fail --silent --head --resolve aidaassistent.ru:443:127.0.0.1 https://aidaassistent.ru/ >/dev/null
          EOF

      - name: Public production smoke test
        timeout-minutes: 2
        run: |
          curl --fail --silent --head https://aidaassistent.ru/ >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' https://aidaassistent.ru/api/auth/me)" = "401"
          curl --fail --silent https://aidaassistent.ru/api/auth/oauth/providers | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("yandex", {}).get("configured") is True; assert data.get("vk", {}).get("configured") is True'

      - name: Deployment summary
        run: echo 'Aida production validated on GitHub-hosted infrastructure and deployed to the new VDS over SSH.'
