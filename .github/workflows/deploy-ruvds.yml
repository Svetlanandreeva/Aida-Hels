name: Deploy to RU VDS

on:
  workflow_run:
    workflows: ['Validate consolidated Aida2']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-ruvds-production
  cancel-in-progress: false

env:
  RUVDS_HOST: 170.168.1.118
  RUVDS_USER: aida

jobs:
  build-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Rebuild approved Expo web frontend
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn lint
          npx tsc --noEmit
          npx expo export -p web
          test -f dist/index.html

      - name: Prepare SSH
        env:
          RUVDS_SSH_KEY: ${{ secrets.RUVDS_SSH_KEY }}
        run: |
          test -n "$RUVDS_SSH_KEY" || (echo 'RUVDS_SSH_KEY secret is missing' && exit 1)
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import base64
          import os
          import re
          import textwrap
          from pathlib import Path

          raw = os.environ['RUVDS_SSH_KEY'].strip()
          key = raw.replace('\\n', '\n').replace('\r\n', '\n').replace('\r', '\n').strip()

          if '-----BEGIN ' not in key:
              try:
                  decoded = base64.b64decode(key, validate=True).decode('utf-8').strip()
                  if '-----BEGIN ' in decoded:
                      key = decoded
              except Exception:
                  pass

          match = re.search(
              r'(-----BEGIN [^-]+-----)(.*?)(-----END [^-]+-----)',
              key,
              flags=re.S,
          )
          if match:
              begin, body, end = match.groups()
              compact = re.sub(r'\s+', '', body)
              if compact:
                  key = begin + '\n' + '\n'.join(textwrap.wrap(compact, 70)) + '\n' + end

          Path.home().joinpath('.ssh/ruvds').write_text(key + '\n')
          PY
          chmod 600 ~/.ssh/ruvds
          ssh-keygen -y -f ~/.ssh/ruvds >/dev/null || (echo 'RUVDS_SSH_KEY is not a valid private key after normalization' && exit 1)
          ssh-keyscan -H "$RUVDS_HOST" >> ~/.ssh/known_hosts

      - name: Verify deploy user access
        run: |
          ssh -i ~/.ssh/ruvds -o IdentitiesOnly=yes "$RUVDS_USER@$RUVDS_HOST" \
            'test -w /opt/aida/backend && test -w /opt/aida/frontend'

      - name: Upload application sources
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.venv' \
            --exclude 'node_modules' \
            --exclude '.git' \
            -e 'ssh -i ~/.ssh/ruvds -o IdentitiesOnly=yes' \
            backend/ "$RUVDS_USER@$RUVDS_HOST:/opt/aida/backend/"

          rsync -az --delete \
            --exclude 'node_modules' \
            -e 'ssh -i ~/.ssh/ruvds -o IdentitiesOnly=yes' \
            frontend/ "$RUVDS_USER@$RUVDS_HOST:/opt/aida/frontend/"

      - name: Restart backend and verify production
        run: |
          ssh -i ~/.ssh/ruvds -o IdentitiesOnly=yes "$RUVDS_USER@$RUVDS_HOST" <<'EOF'
          set -euo pipefail
          cd /opt/aida/backend
          if [ ! -x .venv/bin/python ]; then
            python3 -m venv .venv
          fi
          .venv/bin/python -m pip install -q -r requirements.txt

          if sudo -n /usr/bin/systemctl restart aida-backend 2>/dev/null; then
            echo 'Restarted aida-backend via restricted sudo.'
          else
            pid="$(pgrep -u "$(id -u)" -f 'uvicorn main:app' | head -n 1 || true)"
            if [ -z "$pid" ]; then
              echo 'Cannot restart aida-backend: no passwordless systemctl permission and no running aida-owned uvicorn process.'
              exit 1
            fi
            kill -TERM "$pid"
            echo 'Stopped the aida-owned backend process; systemd Restart=always should bring it back.'
          fi

          for attempt in 1 2 3 4 5 6; do
            sleep 2
            if curl --fail --silent http://127.0.0.1:8000/api/ | grep -q '"status":"ok"'; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo 'Backend health check failed after restart.'
              exit 1
            fi
          done

          curl --fail --silent --head http://127.0.0.1/ >/dev/null
          EOF

      - name: Deployment summary
        run: echo 'Validated RU VDS deployment and smoke checks passed as non-root deploy user.'
