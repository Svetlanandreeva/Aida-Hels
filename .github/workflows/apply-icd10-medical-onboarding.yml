name: Refine ICD-10 medical onboarding integration

on:
  push:
    branches: [feat/icd10-medical-onboarding]
    paths:
      - '.github/workflows/apply-icd10-medical-onboarding.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply refinements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              source = p.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise RuntimeError(f"{path}: expected one match for {old[:120]!r}, got {source.count(old)}")
              p.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "frontend/app/onboarding-medical.tsx",
              '  const continueToLifestyle = async () => {\n    if (!activeId || !activeProfile) return;\n    setBusy(true);',
              '  const continueToLifestyle = async () => {\n    if (!activeId || !activeProfile) return;\n    if (hasChronic && chronicConditions.length === 0) {\n      setError(ru ? "Добавьте хотя бы один хронический диагноз по МКБ-10 или снимите галочку" : "Add at least one chronic ICD-10 diagnosis or uncheck the box");\n      return;\n    }\n    if (hasMental && mentalConditions.length === 0) {\n      setError(ru ? "Добавьте хотя бы одно психическое расстройство по МКБ-10 или снимите галочку" : "Add at least one mental-disorder ICD-10 diagnosis or uncheck the box");\n      return;\n    }\n    setBusy(true);',
          )
          replace_once(
              "frontend/src/components/DiagnosisPicker.tsx",
              '          autoCapitalize="characters"',
              '          autoCapitalize="none"',
          )
          PY

      - name: Commit refinements
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app/onboarding-medical.tsx frontend/src/components/DiagnosisPicker.tsx
          git commit -m 'Refine ICD-10 diagnosis selection validation' || exit 0
          git push origin HEAD:feat/icd10-medical-onboarding
