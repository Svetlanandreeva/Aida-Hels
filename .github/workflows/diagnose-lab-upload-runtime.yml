name: Diagnose lab upload runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-lab-upload-runtime.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUVDS_HOST: ${{ secrets.RUVDS_HOST }}
      RUVDS_USER: ${{ secrets.RUVDS_USER }}
      RUVDS_PORT: ${{ secrets.RUVDS_PORT }}
    steps:
      - name: Prepare SSH
        env:
          RUVDS_SSH_KEY: ${{ secrets.RUVDS_SSH_KEY }}
          RUVDS_SSH_KNOWN_HOSTS: ${{ secrets.RUVDS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RUVDS_SSH_KEY" > ~/.ssh/ruvds
          printf '%s\n' "$RUVDS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ruvds ~/.ssh/known_hosts

      - name: Probe production OCR fallbacks safely
        run: |
          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$RUVDS_USER@$RUVDS_HOST" <<'EOF'
          set -euo pipefail
          cd /opt/aida/backend
          .venv/bin/python - <<'PY'
          import json, os
          import requests
          from dotenv import load_dotenv
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          load_dotenv('.env')
          print('GEMINI_API_KEY_configured=' + str(bool(os.getenv('GEMINI_API_KEY'))))
          print('GEMINI_MODEL=' + str(os.getenv('GEMINI_MODEL') or '<missing>'))
          raw = (os.getenv('GOOGLE_SERVICE_ACCOUNT_JSON') or '').strip()
          print('GOOGLE_SERVICE_ACCOUNT_JSON_configured=' + str(bool(raw)))
          print('GOOGLE_DRIVE_FOLDER_ID_configured=' + str(bool(os.getenv('GOOGLE_DRIVE_FOLDER_ID'))))
          if not raw:
              print('vision_probe=no_service_account')
              raise SystemExit(0)
          try:
              info = json.loads(raw)
          except Exception as exc:
              print('vision_probe=dotenv_value_not_json:' + type(exc).__name__)
              raise SystemExit(0)
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=['https://www.googleapis.com/auth/cloud-platform']
          )
          creds.refresh(Request())
          png = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          payload = {'requests':[{'image':{'content':png},'features':[{'type':'TEXT_DETECTION','maxResults':1}]}]}
          response = requests.post(
              'https://vision.googleapis.com/v1/images:annotate',
              headers={'Authorization':'Bearer '+creds.token,'Content-Type':'application/json'},
              json=payload, timeout=20,
          )
          detail = ''
          try:
              body = response.json()
              detail = ((body.get('error') or {}).get('message') or '')[:240]
              if not detail and body.get('responses'):
                  detail = (((body['responses'][0].get('error') or {}).get('message')) or '')[:240]
          except Exception:
              pass
          print(f'vision_probe_http={response.status_code}')
          if detail:
              print('vision_probe_detail='+detail)
          PY
          EOF
