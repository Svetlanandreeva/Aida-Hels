name: Fix auth email once

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-auth-email.mjs
      - .github/workflows/fix-auth-email-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch-auth-email:
    if: ${{ !contains(github.event.head_commit.message || '', '[auth-mail-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply auth email patch
        run: node scripts/fix-auth-email.mjs

      - name: Commit repaired auth flow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/components/AuthScreen.tsx
          if git diff --cached --quiet; then
            echo "No auth changes to commit."
            exit 0
          fi
          git commit -m "fix(auth): send registration codes by email [auth-mail-fixed]"
          git push
