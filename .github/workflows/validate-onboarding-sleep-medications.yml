name: Validate onboarding sleep and medications

on:
  push:
    branches: [feat/onboarding-sleep-medications]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/validate-onboarding-sleep-medications.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/validate-onboarding-sleep-medications.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Prepare Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          YARN_NETWORK_CONCURRENCY: '1'
        run: yarn install --frozen-lockfile --non-interactive --network-timeout 60000

      - name: Lint frontend
        working-directory: frontend
        run: yarn lint

      - name: Type-check application
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
        run: npx --no-install tsc -p tsconfig.deploy.json --pretty false

      - name: Export Expo web frontend
        working-directory: frontend
        env:
          EXPO_NO_TELEMETRY: '1'
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: |
          npx --no-install expo export -p web
          cp public/aida-logo.svg dist/aida-logo.svg
          test -f dist/index.html
          test -d dist/_expo
          test -s dist/aida-logo.svg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate backend
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pip install -q -r requirements.txt
          python -m compileall -q .
          python -c "import main; assert main.app is not None"
          pytest -q security_tests
