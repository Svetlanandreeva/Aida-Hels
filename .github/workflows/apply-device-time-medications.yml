name: Apply device-time medication fix

on:
  push:
    branches:
      - fix/device-time-medications
    paths:
      - .github/workflows/apply-device-time-medications.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-time-medications

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Apply medication time UX patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"marker not found: {label}")
              if text.count(old) != 1:
                  raise SystemExit(f"marker not unique: {label} ({text.count(old)})")
              return text.replace(old, new, 1)

          onboarding_path = Path("frontend/app/onboarding-medications.tsx")
          onboarding = onboarding_path.read_text()

          onboarding = replace_once(
              onboarding,
              'const DAY_PARTS = ["morning", "day", "evening"] as const;\n',
              'const DAY_PARTS = ["morning", "day", "evening"] as const;\nconst TIME_RE = /^(?:[01]\\d|2[0-3]):[0-5]\\d$/;\n',
              "onboarding time regex",
          )
          onboarding = replace_once(
              onboarding,
              '  const [dayParts, setDayParts] = useState<DayPart[]>([]);\n',
              '  const [dayParts, setDayParts] = useState<DayPart[]>([]);\n  const [timesByPart, setTimesByPart] = useState<Record<DayPart, string>>({ morning: "", day: "", evening: "" });\n',
              "onboarding times state",
          )
          onboarding = replace_once(
              onboarding,
              '    setDayParts([]);\n    setMealRelation("any");\n',
              '    setDayParts([]);\n    setTimesByPart({ morning: "", day: "", evening: "" });\n    setMealRelation("any");\n',
              "onboarding reset times",
          )
          onboarding = replace_once(
              onboarding,
              '  const toggleDayPart = (value: DayPart) => {\n    setDayParts((current) => current.includes(value) ? current.filter((item) => item !== value) : [...current, value]);\n  };\n',
              '  const toggleDayPart = (value: DayPart) => {\n    setDayParts((current) => current.includes(value) ? current.filter((item) => item !== value) : [...current, value]);\n  };\n\n  const setDayPartTime = (part: DayPart, value: string) => {\n    const digits = value.replace(/\\D/g, "").slice(0, 4);\n    const masked = digits.length > 2 ? `${digits.slice(0, 2)}:${digits.slice(2)}` : digits;\n    setTimesByPart((current) => ({ ...current, [part]: masked }));\n    setError(null);\n  };\n',
              "onboarding time setter",
          )
          onboarding = replace_once(
              onboarding,
              '    if (!dayParts.length) {\n      setError(ru ? "Выберите время приёма: утро, день или вечер" : "Choose at least one time of day: morning, daytime or evening");\n      return;\n    }\n\n    setSavingMed(true);\n',
              '    if (!dayParts.length) {\n      setError(ru ? "Выберите время приёма: утро, день или вечер" : "Choose at least one time of day: morning, daytime or evening");\n      return;\n    }\n    const exactTimes = dayParts.map((part) => timesByPart[part].trim());\n    if (exactTimes.some((time) => !TIME_RE.test(time))) {\n      setError(ru ? "Укажите точное время для каждого выбранного приёма в формате ЧЧ:ММ" : "Enter an exact HH:MM time for every selected dose");\n      return;\n    }\n\n    setSavingMed(true);\n',
              "onboarding validate exact time",
          )
          onboarding = replace_once(
              onboarding,
              '        schedule: dayParts.join(","),\n        times: [],\n        day_parts: dayParts,\n',
              '        schedule: exactTimes.join(", "),\n        times: exactTimes,\n        day_parts: dayParts,\n',
              "onboarding persist exact time",
          )
          onboarding = replace_once(
              onboarding,
              '          <View style={s.chips}>\n            {DAY_PARTS.map((part) => <Choice key={part} label={dayPartLabel(part)} active={dayParts.includes(part)} onPress={() => toggleDayPart(part)} />)}\n          </View>\n\n          <Text style={[s.label, { marginTop: spacing.lg }]}>{ru ? "Относительно еды" : "Around meals"}</Text>\n',
              '          <View style={s.chips}>\n            {DAY_PARTS.map((part) => <Choice key={part} label={dayPartLabel(part)} active={dayParts.includes(part)} onPress={() => toggleDayPart(part)} />)}\n          </View>\n          {dayParts.length ? (\n            <View style={s.timeList}>\n              {dayParts.map((part) => (\n                <View key={`time-${part}`} style={s.timeRow}>\n                  <View style={s.timeLabelWrap}>\n                    <Ionicons name="time-outline" size={17} color={colors.onSurfaceSecondary} />\n                    <Text style={s.timeLabel}>{dayPartLabel(part)}</Text>\n                  </View>\n                  <TextInput\n                    value={timesByPart[part]}\n                    onChangeText={(value) => setDayPartTime(part, value)}\n                    placeholder={ru ? "ЧЧ:ММ" : "HH:MM"}\n                    placeholderTextColor={colors.onSurfaceSecondary}\n                    keyboardType="number-pad"\n                    maxLength={5}\n                    style={[s.timeInput, timesByPart[part] && !TIME_RE.test(timesByPart[part]) && s.timeInputInvalid]}\n                    accessibilityLabel={`${dayPartLabel(part)}: ${ru ? "точное время приёма" : "exact medication time"}`}\n                    testID={`onboarding-medication-time-${part}`}\n                  />\n                </View>\n              ))}\n              <Text style={s.timeHint}>{ru ? "Точное время нужно для ближайшего приёма на Главной и уведомлений. Аида использует локальное время вашего устройства." : "Exact times are used for the next-dose card and reminders. Aida uses your device local time."}</Text>\n            </View>\n          ) : null}\n\n          <Text style={[s.label, { marginTop: spacing.lg }]}>{ru ? "Относительно еды" : "Around meals"}</Text>\n',
              "onboarding time inputs",
          )
          onboarding = replace_once(
              onboarding,
              '                <Text style={s.medMeta}>{[med.dose, (med.day_parts || []).map(dayPartLabel).join(" · ")].filter(Boolean).join(" · ")}</Text>\n',
              '                <Text style={s.medMeta}>{[med.dose, (med.times || []).length ? (med.times || []).join(" · ") : (med.day_parts || []).map(dayPartLabel).join(" · ")].filter(Boolean).join(" · ")}</Text>\n                {!(med.times || []).length ? <Text style={s.medTimeWarning}>{ru ? "Точное время не указано — напоминания не будут настроены" : "Exact time is missing — reminders cannot be scheduled"}</Text> : null}\n',
              "onboarding med time status",
          )
          style_insert = '''\n  timeList: { marginTop: spacing.md, gap: spacing.sm },\n  timeRow: { flexDirection: "row", alignItems: "center", justifyContent: "space-between", gap: spacing.md },\n  timeLabelWrap: { flexDirection: "row", alignItems: "center", gap: 8, flex: 1 },\n  timeLabel: { color: colors.onSurface, fontSize: fontSize.base, fontWeight: "700", fontFamily: fonts.text },\n  timeInput: { width: 112, minHeight: 46, borderRadius: radius.md, borderWidth: 1, borderColor: colors.border, backgroundColor: colors.surface, paddingHorizontal: spacing.md, color: colors.onSurface, fontSize: fontSize.lg, fontWeight: "700", textAlign: "center", fontFamily: fonts.text },\n  timeInputInvalid: { borderColor: colors.error },\n  timeHint: { color: colors.onSurfaceSecondary, fontSize: fontSize.sm, lineHeight: 19, fontFamily: fonts.text },\n  medTimeWarning: { marginTop: 3, color: colors.warning, fontSize: fontSize.sm, lineHeight: 18, fontFamily: fonts.text, fontWeight: "700" },\n'''
          last = onboarding.rfind('\n});')
          if last < 0:
              raise SystemExit("onboarding stylesheet terminator not found")
          onboarding = onboarding[:last] + style_insert + onboarding[last:]
          onboarding_path.write_text(onboarding)

          home_path = Path("frontend/app/(tabs)/index.tsx")
          home = home_path.read_text()
          home = replace_once(
              home,
              'function localDateString(date = new Date()) {\n  const y = date.getFullYear();\n  const m = String(date.getMonth() + 1).padStart(2, "0");\n  const d = String(date.getDate()).padStart(2, "0");\n  return `${y}-${m}-${d}`;\n}\n',
              'function localDateString(date = new Date()) {\n  const y = date.getFullYear();\n  const m = String(date.getMonth() + 1).padStart(2, "0");\n  const d = String(date.getDate()).padStart(2, "0");\n  return `${y}-${m}-${d}`;\n}\n\nfunction minutesFromTime(value?: string | null) {\n  const match = String(value || "").match(/^(\\d{2}):(\\d{2})$/);\n  if (!match) return Number.POSITIVE_INFINITY;\n  return Number(match[1]) * 60 + Number(match[2]);\n}\n',
              "home local time helper",
          )
          home = replace_once(
              home,
              '  const activeMed = meds.find((m) => m.active) || null;\n',
              '  const activeMeds = meds.filter((m) => m.active);\n  const activeMed = activeMeds[0] || null;\n  const missingTimeMeds = activeMeds.filter((m) => !(m.times || []).some((time) => Number.isFinite(minutesFromTime(time))));\n  const deviceNow = new Date();\n  const deviceNowMinutes = deviceNow.getHours() * 60 + deviceNow.getMinutes();\n  const nextMedicationSlot = [...medicationSlots]\n    .filter((slot) => slot.status === "pending")\n    .filter((slot) => minutesFromTime(slot.time) >= deviceNowMinutes)\n    .sort((a, b) => minutesFromTime(a.time) - minutesFromTime(b.time))[0] || null;\n',
              "home next medication selection",
          )
          home = replace_once(
              home,
              '            {activeMed ? (\n              <>\n                <Title numberOfLines={1}>{activeMed.name}</Title>\n                <Muted style={{ marginTop: 2 }} numberOfLines={1}>{[activeMed.dose, activeMed.schedule].filter(Boolean).join(" · ") || "—"}</Muted>\n              </>\n            ) : <Muted>{t("no_active_meds")}</Muted>}\n',
              '            {nextMedicationSlot ? (\n              <>\n                <Title numberOfLines={1}>{nextMedicationSlot.name}</Title>\n                <Muted style={{ marginTop: 2 }} numberOfLines={1}>{[nextMedicationSlot.dose, nextMedicationSlot.time].filter(Boolean).join(" · ") || "—"}</Muted>\n              </>\n            ) : missingTimeMeds.length ? (\n              <>\n                <Title numberOfLines={1}>{lang === "ru" ? "Укажите время приёма" : "Set medication time"}</Title>\n                <Muted style={{ marginTop: 2 }} numberOfLines={2}>{lang === "ru" ? "Без точного времени нельзя определить ближайший приём" : "An exact time is required to determine the next dose"}</Muted>\n              </>\n            ) : activeMed ? (\n              <Muted>{lang === "ru" ? "На сегодня ближайших приёмов больше нет" : "No more upcoming doses today"}</Muted>\n            ) : <Muted>{t("no_active_meds")}</Muted>}\n',
              "home next medication widget",
          )
          home = replace_once(
              home,
              '          {readinessOn && <ReadinessProgressCard activeId={activeId} profile={activeProfile} readiness={readiness} hasReadinessData={hasReadinessData} labs={labs} symptoms={symptoms} onOpenLab={openLab} onOpenCheckin={() => setCheckinOpen(true)} onNavigate={(route) => router.push(route as any)} />}\n',
              '          {readinessOn && <ReadinessProgressCard activeId={activeId} profile={activeProfile} readiness={readiness} hasReadinessData={hasReadinessData} labs={labs} symptoms={symptoms} onOpenLab={openLab} onOpenCheckin={() => setCheckinOpen(true)} onNavigate={(route) => router.push(route as any)} />}\n          {missingTimeMeds.length ? (\n            <Pressable style={styles.medicationTimeAlert} onPress={() => router.push("/medications" as any)} testID="medication-time-alert">\n              <View style={styles.medicationTimeAlertIcon}><Ionicons name="alarm-outline" size={20} color={colors.onSurface} /></View>\n              <View style={{ flex: 1 }}>\n                <Text style={styles.medicationTimeAlertTitle}>{lang === "ru" ? "Укажите точное время приёма" : "Set exact medication times"}</Text>\n                <Text style={styles.medicationTimeAlertText}>{lang === "ru" ? `${missingTimeMeds.length === 1 ? missingTimeMeds[0].name : `${missingTimeMeds.length} препаратов`}: время нужно, чтобы правильно показывать ближайший приём и отправлять напоминания.` : `${missingTimeMeds.length === 1 ? missingTimeMeds[0].name : `${missingTimeMeds.length} medications`}: exact times are required for the next-dose card and reminders.`}</Text>\n              </View>\n              <Ionicons name="chevron-forward" size={18} color={colors.onSurfaceSecondary} />\n            </Pressable>\n          ) : null}\n',
              "home missing time alert",
          )
          home_style_insert = '''\n  medicationTimeAlert: { marginBottom: spacing.md, minHeight: 74, borderRadius: radius.lg, borderWidth: 1.5, borderColor: colors.warning, backgroundColor: colors.surfaceSecondary, paddingHorizontal: spacing.lg, paddingVertical: spacing.md, flexDirection: "row", alignItems: "center", gap: spacing.md },\n  medicationTimeAlertIcon: { width: 38, height: 38, borderRadius: 19, alignItems: "center", justifyContent: "center", backgroundColor: colors.surface },\n  medicationTimeAlertTitle: { color: colors.onSurface, fontSize: fontSize.base, fontWeight: "800", fontFamily: fonts.text },\n  medicationTimeAlertText: { marginTop: 3, color: colors.onSurfaceSecondary, fontSize: fontSize.sm, lineHeight: 18, fontFamily: fonts.text },\n'''
          last = home.rfind('\n});')
          if last < 0:
              raise SystemExit("home stylesheet terminator not found")
          home = home[:last] + home_style_insert + home[last:]
          home_path.write_text(home)

          test_path = Path("backend/security_tests/test_device_time_medication_contract.py")
          test_path.write_text('''from pathlib import Path\n\n\ndef test_onboarding_requires_exact_medication_times():\n    source = Path("frontend/app/onboarding-medications.tsx").read_text()\n    assert "times: exactTimes" in source\n    assert "TIME_RE.test(time)" in source\n    assert "onboarding-medication-time-${part}" in source\n    assert "Аида использует локальное время вашего устройства" in source\n\n\ndef test_home_uses_device_time_and_warns_for_missing_schedule():\n    source = Path("frontend/app/(tabs)/index.tsx").read_text()\n    assert "deviceNow.getHours() * 60 + deviceNow.getMinutes()" in source\n    assert "nextMedicationSlot" in source\n    assert "medication-time-alert" in source\n    assert "missingTimeMeds" in source\n    assert "activeMed.schedule" not in source\n\n\ndef test_schedule_requests_already_send_device_local_time():\n    home_api = Path("frontend/src/homeApi.ts").read_text()\n    schedule_api = Path("frontend/src/medicationScheduleApi.ts").read_text()\n    assert "now_local: localTime()" in home_api\n    assert "now_local=${encodeURIComponent(localTime())}" in schedule_api\n''')
          PY

      - name: Validate frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn lint
          yarn tsc --noEmit

      - name: Validate contract
        run: python -m pytest -q backend/security_tests/test_device_time_medication_contract.py

      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/apply-device-time-medications.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/onboarding-medications.tsx 'frontend/app/(tabs)/index.tsx' backend/security_tests/test_device_time_medication_contract.py .github/workflows/apply-device-time-medications.yml
          git commit -m "Use device time for medication schedules"
          git push origin HEAD:fix/device-time-medications
