name: Validate native wearables

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/modules/aida-healthkit/**'
      - 'frontend/app.json'
      - '.github/workflows/validate-native-wearables.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-healthkit:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile

      - name: Prebuild iOS project
        working-directory: frontend
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Verify HealthKit module autolinking
        working-directory: frontend
        run: |
          npx expo-modules-autolinking resolve --platform apple > /tmp/expo-apple-modules.json
          cat /tmp/expo-apple-modules.json
          grep -q 'AidaHealthKit' /tmp/expo-apple-modules.json

      - name: Install CocoaPods
        working-directory: frontend
        run: npx pod-install

      - name: Compile iOS simulator build without signing
        working-directory: frontend
        run: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(basename "$workspace" .xcworkspace)"
          echo "Building workspace=$workspace scheme=$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
