name: Validate consolidated Aida2

# Run the same application-quality gate on pull requests before production.
# Production deploy remains isolated in deploy-ruvds.yml and is never executed
# from a pull_request event.
on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'ios/**'
      - 'android/**'
      - '.github/workflows/validate-consolidated-aida2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: yarn lint

      - name: Type-check deploy frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
        run: npx --no-install tsc -p tsconfig.deploy.json --pretty false

      - name: Build web frontend
        working-directory: frontend
        env:
          EXPO_NO_TELEMETRY: '1'
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: npx --no-install expo export -p web

      - name: Verify web build output
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/_expo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Compile backend Python sources
        run: python -m compileall -q backend

      - name: Import production backend entrypoint
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -c "import main; assert main.app is not None"

      - name: Run security and wearable regression tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q security_tests

      - name: Verify native health bridge sources exist
        run: |
          test -f ios/AppleHealthSyncClient.swift
          test -f ios/HealthKitManager.swift
          test -f ios/AidaHealthSyncCoordinator.swift
          test -f android/AidaHealthConnectManager.kt

      - name: Consolidated application validation passed
        run: echo 'Aida2 frontend, backend, security tests, and native health bridge sources validated'
