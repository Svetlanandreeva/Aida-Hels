name: Validate consolidated Aida2

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'ios/**'
      - '.github/workflows/validate-consolidated-aida2.yml'
  push:
    branches:
      - main
      - 'hardening/**'
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'ios/**'
      - '.github/workflows/validate-consolidated-aida2.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: yarn lint

      - name: Type-check Expo frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build web frontend
        working-directory: frontend
        run: npx expo export -p web

      - name: Verify web build output
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/_expo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Compile backend Python sources
        run: python -m compileall -q backend

      - name: Import production backend entrypoint
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -c "import main; assert main.app is not None"

      - name: Run authorization unit tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q security_tests/test_access_control.py

      - name: Verify iOS source exists
        run: |
          test -f ios/AppleHealthSyncClient.swift
          test -f ios/HealthKitManager.swift

      - name: Consolidated application validation passed
        run: echo 'Aida2 frontend, backend authorization layer, and iOS source validated'
