name: Validate medication catalogue branch

on:
  push:
    branches:
      - feat/medication-reference-catalog

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Prepare Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive

      - name: Lint frontend
        working-directory: frontend
        run: yarn lint

      - name: Type-check deploy frontend
        working-directory: frontend
        run: npx --no-install tsc -p tsconfig.deploy.json --pretty false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -q -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Run medication regression tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q security_tests/test_medication_reference.py security_tests/test_onboarding_sleep_medications_contract.py

      - name: Import production backend
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -c "import main; assert main.app is not None"
