name: Responsive primary screens once

on:
  push:
    branches:
      - fix/responsive-navigation-shell-v3

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/responsive-navigation-shell-v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Patch responsive behavior into primary screens
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrences, found {actual}: {old[:80]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          # Home / Puzzle
          path = 'frontend/app/(tabs)/index.tsx'
          rep(path, 'import { useI18n } from "@/src/i18n";\n', 'import { useI18n } from "@/src/i18n";\nimport { useResponsiveLayout } from "@/src/hooks/use-responsive-layout";\n')
          rep(path, '  const { openMenu, openLab, toast } = useLog();\n', '  const { openMenu, openLab, toast } = useLog();\n  const responsive = useResponsiveLayout();\n')
          rep(path, '          <Card key={id} testID="widget-medication" style={styles.halfCard}>', '          <Card key={id} testID="widget-medication" style={[styles.halfCard, responsive.width < 480 && styles.fullWidthCard]}>')
          rep(path, '          <Card key={id} testID="widget-symptom" style={styles.halfCard}>', '          <Card key={id} testID="widget-symptom" style={[styles.halfCard, responsive.width < 480 && styles.fullWidthCard]}>')
          rep(path, '      rows.push(<View key={`row-${i}`} style={styles.halfRow}>{renderWidget(w.id)}{renderWidget(nextW!.id)}</View>);', '      rows.push(<View key={`row-${i}`} style={[styles.halfRow, responsive.width < 480 && styles.stackRow]}>{renderWidget(w.id)}{renderWidget(nextW!.id)}</View>);')
          rep(path, '<View style={[styles.header, { paddingTop: insets.top + spacing.sm }]}><TopBar', '<View style={[styles.header, { paddingTop: insets.top + spacing.sm, paddingHorizontal: responsive.contentPadding }]}><TopBar')
          rep(path, 'contentContainerStyle={{ padding: spacing.lg, paddingBottom: 130 + insets.bottom }}', 'contentContainerStyle={{ paddingHorizontal: responsive.contentPadding, paddingTop: spacing.lg, paddingBottom: (responsive.isDesktop ? 40 : 96) + insets.bottom }}')
          rep(path, '<View style={styles.dualRow}><Card style={styles.dualCard}', '<View style={[styles.dualRow, responsive.width < 480 && styles.stackRow]}><Card style={[styles.dualCard, responsive.width < 480 && styles.fullWidthCard]}')
          rep(path, '<GradientCard gradient={gradients.pink} style={styles.dualCard}', '<GradientCard gradient={gradients.pink} style={[styles.dualCard, responsive.width < 480 && styles.fullWidthCard]}')
          rep(path, '  dualRow: { flexDirection: "row", gap: spacing.md },\n', '  dualRow: { flexDirection: "row", gap: spacing.md },\n  stackRow: { flexDirection: "column" },\n  fullWidthCard: { flex: 0, width: "100%" },\n')

          # Health
          path = 'frontend/app/(tabs)/health.tsx'
          rep(path, 'import { useI18n } from "@/src/i18n";\n', 'import { useI18n } from "@/src/i18n";\nimport { useResponsiveLayout } from "@/src/hooks/use-responsive-layout";\n')
          rep(path, '  const { openSymptom, openMed, openLab } = useLog();\n', '  const { openSymptom, openMed, openLab } = useLog();\n  const responsive = useResponsiveLayout();\n')
          rep(path, '<View style={[styles.header, { paddingTop: insets.top + spacing.sm }]}>', '<View style={[styles.header, { paddingTop: insets.top + spacing.sm, paddingHorizontal: responsive.contentPadding }]}>')
          rep(path, 'contentContainerStyle={{ padding: spacing.lg, paddingBottom: 40 + insets.bottom }}', 'contentContainerStyle={{ paddingHorizontal: responsive.contentPadding, paddingTop: spacing.lg, paddingBottom: (responsive.isDesktop ? 40 : 92) + insets.bottom }}')
          rep(path, '              style={styles.cell}\n', '              style={[styles.cell, { width: responsive.isTinyPhone ? "100%" : (responsive.isTablet || responsive.isDesktop) ? "31.6%" : "47.8%" }]}\n')
          rep(path, '<GradientCard gradient={m.grad} style={styles.modCard}>', '<GradientCard gradient={m.grad} style={[styles.modCard, responsive.isCompactPhone && styles.modCardCompact]}>')
          rep(path, '  modCard: { minHeight: 130, justifyContent: "space-between", padding: spacing.lg },\n', '  modCard: { minHeight: 130, justifyContent: "space-between", padding: spacing.lg },\n  modCardCompact: { minHeight: 118, padding: spacing.md },\n')

          # Chat
          path = 'frontend/app/(tabs)/chat.tsx'
          rep(path, 'import { useI18n } from "@/src/i18n";\n', 'import { useI18n } from "@/src/i18n";\nimport { useResponsiveLayout } from "@/src/hooks/use-responsive-layout";\n')
          rep(path, '  const { t, lang } = useI18n();\n', '  const { t, lang } = useI18n();\n  const responsive = useResponsiveLayout();\n')
          rep(path, '<View style={[styles.header, { paddingTop: insets.top + spacing.sm }]}>', '<View style={[styles.header, { paddingTop: insets.top + spacing.sm, paddingHorizontal: responsive.contentPadding }]}>')
          rep(path, 'contentContainerStyle={{ padding: spacing.lg, paddingBottom: spacing.lg, gap: spacing.md }}', 'contentContainerStyle={{ paddingHorizontal: responsive.contentPadding, paddingTop: spacing.lg, paddingBottom: spacing.lg, gap: spacing.md }}')
          rep(path, '<View style={[styles.bubble, styles.bubbleAida, { flex: 1 }]}>', '<View style={[styles.bubble, { maxWidth: responsive.isCompactPhone ? "86%" : responsive.isTablet ? "72%" : "78%" }, styles.bubbleAida, { flex: 1 }]}>')
          rep(path, '<View style={[styles.bubble, m.role === "user" ? styles.bubbleUser : styles.bubbleAida]}>', '<View style={[styles.bubble, { maxWidth: responsive.isCompactPhone ? "86%" : responsive.isTablet ? "72%" : "78%" }, m.role === "user" ? styles.bubbleUser : styles.bubbleAida]}>')
          rep(path, '<View style={[styles.bubble, styles.bubbleAida]}>\n                    <Text style={styles.typingText}>', '<View style={[styles.bubble, { maxWidth: responsive.isCompactPhone ? "86%" : responsive.isTablet ? "72%" : "78%" }, styles.bubbleAida]}>\n                    <Text style={styles.typingText}>')
          rep(path, '<View style={[styles.inputBar, { paddingBottom: insets.bottom + spacing.sm }]}>', '<View style={[styles.inputBar, { paddingHorizontal: responsive.contentPadding, paddingBottom: insets.bottom + spacing.sm }]}>')

          # Tasks
          path = 'frontend/app/(tabs)/tasks.tsx'
          rep(path, 'import { useI18n } from "@/src/i18n";\n', 'import { useI18n } from "@/src/i18n";\nimport { useResponsiveLayout } from "@/src/hooks/use-responsive-layout";\n')
          rep(path, '  const { toast } = useLog();\n', '  const { toast } = useLog();\n  const responsive = useResponsiveLayout();\n')
          rep(path, '<View key={task.id} style={styles.taskRow}', '<View key={task.id} style={[styles.taskRow, responsive.isCompactPhone && styles.taskRowCompact]}')
          rep(path, '<View style={styles.taskIcon}>', '<View style={[styles.taskIcon, responsive.isTinyPhone && styles.taskIconTiny]}>')
          rep(path, '<View style={[styles.header, { paddingTop: insets.top + spacing.sm }]}>', '<View style={[styles.header, { paddingTop: insets.top + spacing.sm, paddingHorizontal: responsive.contentPadding }]}>')
          rep(path, 'contentContainerStyle={{ padding: spacing.lg, paddingBottom: 40 + insets.bottom }}', 'contentContainerStyle={{ paddingHorizontal: responsive.contentPadding, paddingTop: spacing.lg, paddingBottom: (responsive.isDesktop ? 40 : 92) + insets.bottom }}')
          rep(path, '<Pressable style={styles.addCard}', '<Pressable style={[styles.addCard, responsive.isCompactPhone && styles.addCardCompact]}')
          rep(path, '  addCard: { minHeight: 82, borderRadius: radius.xl, backgroundColor: colors.onSurface, paddingHorizontal: spacing.lg, paddingVertical: spacing.md, marginBottom: spacing.xl, flexDirection: "row", alignItems: "center", gap: spacing.md },\n', '  addCard: { minHeight: 82, borderRadius: radius.xl, backgroundColor: colors.onSurface, paddingHorizontal: spacing.lg, paddingVertical: spacing.md, marginBottom: spacing.xl, flexDirection: "row", alignItems: "center", gap: spacing.md },\n  addCardCompact: { paddingHorizontal: spacing.md, gap: spacing.sm },\n')
          rep(path, '  taskRow: { flexDirection: "row", alignItems: "center", gap: spacing.md, paddingVertical: spacing.md, borderBottomWidth: 1, borderBottomColor: colors.divider },\n', '  taskRow: { flexDirection: "row", alignItems: "center", gap: spacing.md, paddingVertical: spacing.md, borderBottomWidth: 1, borderBottomColor: colors.divider },\n  taskRowCompact: { gap: spacing.sm },\n')
          rep(path, '  taskIcon: { width: 32, height: 32, borderRadius: 16, backgroundColor: colors.surface, alignItems: "center", justifyContent: "center" },\n', '  taskIcon: { width: 32, height: 32, borderRadius: 16, backgroundColor: colors.surface, alignItems: "center", justifyContent: "center" },\n  taskIconTiny: { width: 28, height: 28, borderRadius: 14 },\n')

          # Profile
          path = 'frontend/app/(tabs)/profile.tsx'
          rep(path, 'import { useI18n } from "@/src/i18n";\n', 'import { useI18n } from "@/src/i18n";\nimport { useResponsiveLayout } from "@/src/hooks/use-responsive-layout";\n')
          rep(path, '  const { t, lang, setLang } = useI18n();\n', '  const { t, lang, setLang } = useI18n();\n  const responsive = useResponsiveLayout();\n')
          rep(path, '<View style={styles.coverWrap}>', '<View style={[styles.coverWrap, responsive.isCompactPhone && styles.coverWrapCompact]}>')
          rep(path, '<View style={styles.body}>', '<View style={[styles.body, { paddingHorizontal: responsive.contentPadding }]}>')
          rep(path, '<View style={styles.metricRow}>', '<View style={[styles.metricRow, responsive.isCompactPhone && styles.metricRowCompact]}>')
          rep(path, '<Metric label={t("height")} value={activeProfile.height_cm ? `${activeProfile.height_cm} см` : "—"} />', '<Metric compact={responsive.isCompactPhone} label={t("height")} value={activeProfile.height_cm ? `${activeProfile.height_cm} см` : "—"} />')
          rep(path, '<Metric label={t("weight")} value={activeProfile.weight_kg ? `${activeProfile.weight_kg} кг` : "—"} />', '<Metric compact={responsive.isCompactPhone} label={t("weight")} value={activeProfile.weight_kg ? `${activeProfile.weight_kg} кг` : "—"} />')
          rep(path, '<Metric label={t("blood_type")} value={activeProfile.blood_type || "—"} />', '<Metric compact={responsive.isCompactPhone} label={t("blood_type")} value={activeProfile.blood_type || "—"} />')
          rep(path, 'const Metric: React.FC<{ label: string; value: string }> = ({ label, value }) => (\n  <View style={styles.metric}>', 'const Metric: React.FC<{ label: string; value: string; compact?: boolean }> = ({ label, value, compact }) => (\n  <View style={[styles.metric, compact && styles.metricCompact]}>')
          rep(path, '  coverWrap: { height: 180 },\n', '  coverWrap: { height: 180 },\n  coverWrapCompact: { height: 150 },\n')
          rep(path, '  metricRow: { flexDirection: "row", gap: spacing.md, marginTop: spacing.lg },\n', '  metricRow: { flexDirection: "row", gap: spacing.md, marginTop: spacing.lg },\n  metricRowCompact: { flexDirection: "column" },\n')
          rep(path, '    borderColor: colors.glassBorder,\n  },\n  metricValue:', '    borderColor: colors.glassBorder,\n  },\n  metricCompact: { flex: 0, width: "100%" },\n  metricValue:')
          PY

      - name: Validate frontend
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn lint
          npx tsc --noEmit
          npx expo export -p web
          test -f dist/index.html

      - name: Commit responsive screen changes and remove one-shot workflow
        run: |
          rm .github/workflows/responsive-primary-screens-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/app/'(tabs)'/index.tsx frontend/app/'(tabs)'/health.tsx frontend/app/'(tabs)'/chat.tsx frontend/app/'(tabs)'/tasks.tsx frontend/app/'(tabs)'/profile.tsx .github/workflows/responsive-primary-screens-once.yml
          git commit -m "Adapt primary screens across mobile breakpoints"
          git push origin HEAD:fix/responsive-navigation-shell-v3
