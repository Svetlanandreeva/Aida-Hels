name: Deploy to RU VDS (hosted fallback)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy-ruvds-hosted.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ruvds-hosted-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUVDS_HOST: ${{ secrets.RUVDS_HOST }}
      RUVDS_USER: root
      RUVDS_PORT: ${{ secrets.RUVDS_PORT }}
      CI: '1'
    steps:
      - name: Checkout production revision
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        env:
          RUVDS_SSH_KEY: ${{ secrets.RUVDS_SSH_KEY }}
          RUVDS_SSH_KNOWN_HOSTS: ${{ secrets.RUVDS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$RUVDS_HOST" || (echo 'RUVDS_HOST secret is missing' && exit 1)
          test -n "$RUVDS_USER" || (echo 'RUVDS_USER is missing' && exit 1)
          test -n "$RUVDS_SSH_KEY" || (echo 'RUVDS_SSH_KEY secret is missing' && exit 1)
          test -n "$RUVDS_SSH_KNOWN_HOSTS" || (echo 'RUVDS_SSH_KNOWN_HOSTS secret is missing' && exit 1)
          test -n "$RUVDS_PORT" || (echo 'RUVDS_PORT secret is missing' && exit 1)

      - name: Normalize SSH endpoint secrets
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          host = os.environ['RUVDS_HOST'].strip()
          user = os.environ['RUVDS_USER'].strip()
          port = os.environ['RUVDS_PORT'].strip()
          if not re.fullmatch(r'[A-Za-z0-9._-]+', user):
              raise SystemExit('RUVDS_USER must contain only letters, digits, dot, underscore or hyphen')
          if not host or any(ch.isspace() for ch in host) or '@' in host:
              raise SystemExit('RUVDS_HOST contains invalid whitespace or @')
          if not port.isdigit() or not (1 <= int(port) <= 65535):
              raise SystemExit('RUVDS_PORT must be a valid TCP port')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'RUVDS_HOST={host}\nRUVDS_USER={user}\nRUVDS_PORT={port}\n')
          PY

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Prepare Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive --network-timeout 60000

      - name: Lint frontend
        working-directory: frontend
        run: yarn lint

      - name: Type-check frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
        run: npx --no-install tsc -p tsconfig.deploy.json --pretty false

      - name: Export Expo web frontend
        working-directory: frontend
        env:
          EXPO_NO_TELEMETRY: '1'
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: |
          npx --no-install expo export -p web
          cp public/aida-logo.svg dist/aida-logo.svg
          test -f dist/index.html
          test -d dist/_expo
          test -s dist/aida-logo.svg

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate backend
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pip install -q -r requirements.txt
          python -m compileall -q .
          python -c "import main; assert main.app is not None"
          pytest -q security_tests

      - name: Prepare pinned SSH identity
        env:
          RUVDS_SSH_KEY: ${{ secrets.RUVDS_SSH_KEY }}
          RUVDS_SSH_KNOWN_HOSTS: ${{ secrets.RUVDS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          raw = os.environ['RUVDS_SSH_KEY'].strip()
          key_bytes = base64.b64decode(raw, validate=True)
          if b'-----BEGIN ' not in key_bytes:
              raise SystemExit('Decoded RUVDS_SSH_KEY is not a private key')
          Path.home().joinpath('.ssh/ruvds').write_bytes(key_bytes)
          Path.home().joinpath('.ssh/known_hosts').write_text(os.environ['RUVDS_SSH_KNOWN_HOSTS'].strip() + '\n', encoding='utf-8')
          PY
          chmod 600 ~/.ssh/ruvds ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/ruvds >/dev/null

      - name: Verify restricted production access
        run: |
          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RUVDS_USER@$RUVDS_HOST" \
            'set -e; test -w /opt/aida/backend; test -w /opt/aida/frontend; sudo -n /usr/bin/systemctl status aida-backend >/dev/null'

      - name: Upload application sources
        run: |
          SSH="ssh -p $RUVDS_PORT -i ~/.ssh/ruvds -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          $SSH "$RUVDS_USER@$RUVDS_HOST" <<'EOF'
          set -euo pipefail
          find /opt/aida/backend -mindepth 1 -maxdepth 1 ! -name '.env' ! -name '.venv' -exec rm -rf -- {} +
          find /opt/aida/frontend -mindepth 1 -maxdepth 1 ! -name 'node_modules' -exec rm -rf -- {} +
          EOF
          tar -C backend --exclude='.env' --exclude='.venv' --exclude='node_modules' --exclude='.git' -czf - . | $SSH "$RUVDS_USER@$RUVDS_HOST" 'tar -xzf - -C /opt/aida/backend'
          tar -C frontend --exclude='node_modules' --exclude='.git' -czf - . | $SSH "$RUVDS_USER@$RUVDS_HOST" 'tar -xzf - -C /opt/aida/frontend'

      - name: Ensure persistent auth secret and restart backend
        run: |
          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RUVDS_USER@$RUVDS_HOST" <<'EOF'
          set -euo pipefail
          cd /opt/aida/backend
          touch .env
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          path = Path('.env')
          lines = path.read_text().splitlines()
          existing = next((line.split('=', 1)[1].strip() for line in lines if line.startswith('JWT_SECRET=')), None)
          if not existing or len(existing) < 32:
              generated = secrets.token_hex(32)
              updated = [line for line in lines if not line.startswith('JWT_SECRET=')]
              if updated and updated[-1] != '':
                  updated.append('')
              updated.append(f'JWT_SECRET={generated}')
              path.write_text('\n'.join(updated).rstrip() + '\n')
          PY
          SERVICE_USER="$(sudo -n /usr/bin/systemctl show aida-backend -p User --value)"
          if [ -z "$SERVICE_USER" ]; then SERVICE_USER=root; fi
          SERVICE_GROUP="$(id -gn "$SERVICE_USER")"
          chown root:"$SERVICE_GROUP" .env
          chmod 640 .env
          if [ ! -x .venv/bin/python ]; then python3 -m venv .venv; fi
          .venv/bin/python -m pip install -q -r requirements.txt
          sudo -n /usr/bin/systemctl restart aida-backend
          for attempt in $(seq 1 30); do
            sleep 2
            if curl --fail --silent http://127.0.0.1:8000/api/ | grep -q '"status":"ok"'; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Backend health check timed out after 60 seconds.'
              sudo -n /usr/bin/systemctl status aida-backend --no-pager || true
              sudo -n /usr/bin/journalctl -u aida-backend -n 120 --no-pager || true
              exit 1
            fi
          done
          AUTH_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/auth/me)"
          test "$AUTH_STATUS" = '401' || (echo "Unexpected /api/auth/me status: $AUTH_STATUS" && exit 1)
          curl --fail --silent --head --resolve aidaassistent.ru:443:127.0.0.1 https://aidaassistent.ru/ >/dev/null
          EOF

      - name: Deployment summary
        run: echo 'Aida production validated and deployed through GitHub-hosted fallback runner.'
