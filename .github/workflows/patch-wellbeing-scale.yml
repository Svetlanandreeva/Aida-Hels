name: Patch wellbeing scale visual

on:
  push:
    branches: [feat/onboarding-sleep-medications]
    paths:
      - '.github/workflows/patch-wellbeing-scale.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/onboarding-sleep-medications
      - name: Convert segmented tiles to continuous scale
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/app/onboarding-lifestyle.tsx')
          text = path.read_text(encoding='utf-8')
          old_function = '''function ScaleField({ label, value, onChange, low, high }: any) { return <View style={{ marginBottom: spacing.lg }}><Text style={s.label}>{label}</Text><View style={s.scaleTrack}>{SCALE.map((item) => <Pressable key={item} style={({ pressed }) => [s.scaleSegment, { backgroundColor: SCALE_COLORS[item] }, value === item && s.scaleSelected, pressed && s.pressed]} onPress={() => onChange(value === item ? null : item)} accessibilityRole="button" accessibilityLabel={`${label}: ${item} / 5`} accessibilityState={{ selected: value === item }}><Text style={s.scaleText}>{item}</Text></Pressable>)}</View><View style={s.scaleLabels}><Text style={s.scaleHint}>{`0 · ${low}`}</Text><Text style={s.scaleHint}>{`5 · ${high}`}</Text></View></View>; }'''
          new_function = '''function ScaleField({ label, value, onChange, low, high }: any) { return <View style={{ marginBottom: spacing.lg }}><Text style={s.label}>{label}</Text><View style={s.scaleBar} accessible={false}>{SCALE.map((item) => <View key={`color-${item}`} style={[s.scaleColor, { backgroundColor: SCALE_COLORS[item] }]} />)}</View><View style={s.scaleTicks}>{SCALE.map((item) => <Pressable key={item} style={({ pressed }) => [s.scaleTick, value === item && s.scaleTickSelected, pressed && s.pressed]} onPress={() => onChange(value === item ? null : item)} accessibilityRole="button" accessibilityLabel={`${label}: ${item} / 5`} accessibilityState={{ selected: value === item }}><Text style={[s.scaleText, value === item && s.scaleTextSelected]}>{item}</Text></Pressable>)}</View><View style={s.scaleLabels}><Text style={s.scaleHint}>{`0 · ${low}`}</Text><Text style={s.scaleHint}>{`5 · ${high}`}</Text></View></View>; }'''
          old_styles = '''scaleTrack:{flexDirection:"row",height:48,borderRadius:radius.pill,overflow:"hidden",borderWidth:1,borderColor:colors.borderStrong},scaleSegment:{flex:1,alignItems:"center",justifyContent:"center"},scaleSelected:{borderWidth:3,borderColor:colors.onSurface},scaleText:{fontWeight:"900",fontSize:fontSize.base,color:colors.onSurface,fontFamily:fonts.text},scaleLabels:{flexDirection:"row",justifyContent:"space-between",marginTop:7,gap:spacing.sm},scaleHint:{fontSize:12,color:colors.onSurfaceSecondary,flexShrink:1}'''
          new_styles = '''scaleBar:{flexDirection:"row",height:12,borderRadius:radius.pill,overflow:"hidden",borderWidth:1,borderColor:colors.borderStrong},scaleColor:{flex:1},scaleTicks:{flexDirection:"row",justifyContent:"space-between",alignItems:"center",marginTop:10},scaleTick:{width:34,height:34,borderRadius:17,alignItems:"center",justifyContent:"center",backgroundColor:colors.surface,borderWidth:1,borderColor:colors.borderStrong},scaleTickSelected:{backgroundColor:colors.onSurface,borderColor:colors.onSurface},scaleText:{fontWeight:"900",fontSize:fontSize.sm,color:colors.onSurface,fontFamily:fonts.text},scaleTextSelected:{color:colors.onSurfaceInverse},scaleLabels:{flexDirection:"row",justifyContent:"space-between",marginTop:7,gap:spacing.sm},scaleHint:{fontSize:12,color:colors.onSurfaceSecondary,flexShrink:1}'''
          if old_function not in text:
              raise SystemExit('Expected ScaleField implementation not found')
          if old_styles not in text:
              raise SystemExit('Expected scale styles not found')
          text = text.replace(old_function, new_function, 1).replace(old_styles, new_styles, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit scale visual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app/onboarding-lifestyle.tsx
          git commit -m 'Render wellbeing as continuous color scale'
          git push origin HEAD:feat/onboarding-sleep-medications
