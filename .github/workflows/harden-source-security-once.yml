name: Harden source security once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-source-security-once.yml'
      - 'scripts/harden-source-security.mjs'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply all source hardening
        run: |
          node scripts/harden-source-security.mjs
          node scripts/harden-server-auth.mjs
          node scripts/harden-server-access.mjs
          node scripts/harden-integrations.mjs
          node scripts/harden-server-no-fabrication-v2.mjs
      - name: Verify source safety
        run: node scripts/audit-production-safety.mjs
      - name: Commit hardened source
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts server/*.ts src scripts/*.mjs
          git commit -m 'fix(security): persist production safety hardening in source'
          git push
