name: Harden source security once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-source-security-once.yml'
      - 'scripts/harden-source-security.mjs'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden source
        run: node scripts/harden-source-security.mjs
      - name: Verify source safety
        run: node scripts/audit-production-safety.mjs
      - name: Commit source fixes
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'fix(security): harden source auth consent and errors'
          git push
