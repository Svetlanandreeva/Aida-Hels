name: Patch wearable home link once

on:
  push:
    branches:
      - feature/wearable-health-connectors-v1
    paths:
      - .github/workflows/patch-wearable-home-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wearable-health-connectors-v1
      - name: Patch device card and remove one-shot workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/app/(tabs)/index.tsx")
          text = path.read_text()
          old = 'onPress={() => toast(lang === "ru" ? "Подключение устройств — скоро" : "Device sync — coming soon")}'
          new = 'onPress={() => router.push("/devices" as any)}'
          if old not in text:
              raise SystemExit("Expected wearable placeholder was not found")
          text = text.replace(old, new, 1)
          text = text.replace('>Apple Watch · Xiaomi</Muted>', '>Apple Watch · Android · Garmin · Oura</Muted>', 1)
          path.write_text(text)
          Path(".github/workflows/patch-wearable-home-once.yml").unlink()
      - name: Commit patch
        run: |
          git config user.name "Svetlana Andreeva"
          git config user.email "AnbreevaSveta@yandex.ru"
          git add frontend/app/'(tabs)'/index.tsx .github/workflows/patch-wearable-home-once.yml
          git commit -m "Wire wearable device card to devices screen"
          git push
