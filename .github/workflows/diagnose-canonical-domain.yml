name: Diagnose canonical production domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-canonical-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUVDS_HOST: ${{ secrets.RUVDS_HOST }}
      RUVDS_USER: ${{ secrets.RUVDS_USER }}
      RUVDS_PORT: ${{ secrets.RUVDS_PORT }}
    steps:
      - name: Prepare SSH
        env:
          RUVDS_SSH_KEY: ${{ secrets.RUVDS_SSH_KEY }}
          RUVDS_SSH_KNOWN_HOSTS: ${{ secrets.RUVDS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RUVDS_SSH_KEY" > ~/.ssh/ruvds
          printf '%s\n' "$RUVDS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ruvds ~/.ssh/known_hosts

      - name: Inspect actual production bundle contents
        run: |
          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RUVDS_USER@$RUVDS_HOST" <<'EOF'
          set -euo pipefail
          host='aidaassistent.ru'
          curl -ksS --max-time 15 "https://$host/" -o /tmp/public-index.html
          bundle="$(grep -oE '/_expo/static/js/web/[^\" ]+\.js' /tmp/public-index.html | head -n 1)"
          test -n "$bundle"
          echo "BUNDLE=$bundle"
          curl -ksS --max-time 30 "https://$host$bundle" -o /tmp/public-bundle.js
          sha256sum /tmp/public-bundle.js
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/public-bundle.js').read_text(errors='ignore')
          probes = [
              'Общее состояние сегодня',
              'Состояние сегодня',
              'ИИ-итог дня',
              'Аида заметила',
              'Добавьте первые данные',
              'Готовность',
              'home-editorial-hero',
          ]
          for probe in probes:
              print(f'{probe}: {probe in text}')
          PY
          EOF
