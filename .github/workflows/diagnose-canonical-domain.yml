name: Diagnose canonical production domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-canonical-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUVDS_HOST: ${{ secrets.RUVDS_HOST }}
      RUVDS_USER: ${{ secrets.RUVDS_USER }}
      RUVDS_PORT: ${{ secrets.RUVDS_PORT }}
    steps:
      - name: Prepare SSH
        env:
          RUVDS_SSH_KEY: ${{ secrets.RUVDS_SSH_KEY }}
          RUVDS_SSH_KNOWN_HOSTS: ${{ secrets.RUVDS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RUVDS_SSH_KEY" > ~/.ssh/ruvds
          printf '%s\n' "$RUVDS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ruvds ~/.ssh/known_hosts

      - name: Compare production root and served bundle
        run: |
          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RUVDS_USER@$RUVDS_HOST" <<'EOF'
          set -euo pipefail
          host='aidaassistent.ru'
          echo '=== deployed web root ==='
          sha256sum /opt/aida/web/index.html
          echo '=== nginx configuration ==='
          sudo -n nginx -T 2>/dev/null | grep -E -B3 -A12 'server_name .*aidaassistent\.ru' || true
          echo '=== public response ==='
          curl -ksS --max-time 15 "https://$host/" -o /tmp/public-index.html
          sha256sum /tmp/public-index.html
          echo '=== bundle references ==='
          grep -oE '/_expo/static/js/web/[^" ]+\.js' /opt/aida/web/index.html | head -n 5 || true
          grep -oE '/_expo/static/js/web/[^" ]+\.js' /tmp/public-index.html | head -n 5 || true
          echo '=== response headers ==='
          curl -ksSI --max-time 15 "https://$host/" | grep -Ei '^(HTTP/|cache-control:|age:|server:|etag:|last-modified:)' || true
          echo '=== compare ==='
          cmp -s /opt/aida/web/index.html /tmp/public-index.html && echo 'PUBLIC_INDEX_MATCHES_DEPLOYED=yes' || echo 'PUBLIC_INDEX_MATCHES_DEPLOYED=no'
          EOF
