name: Diagnose ICD-10 security tests

on:
  push:
    branches: [feat/icd10-medical-onboarding]
    paths:
      - '.github/workflows/diagnose-icd10-security.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run security tests and capture failures
        run: |
          set +e
          mkdir -p ops
          python -m pytest backend/security_tests -q > /tmp/pytest.txt 2>&1
          rc=$?
          printf 'pytest_exit=%s\n' "$rc" > ops/icd10-security-diagnostic.txt
          tail -n 120 /tmp/pytest.txt >> ops/icd10-security-diagnostic.txt
          cat ops/icd10-security-diagnostic.txt
          exit 0
      - name: Persist diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/icd10-security-diagnostic.txt
          git commit -m 'Record ICD-10 security diagnostic' || exit 0
          git push origin HEAD:feat/icd10-medical-onboarding
