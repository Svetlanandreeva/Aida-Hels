name: Safety Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  safety-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production safety audit
        run: npm run audit:safety
