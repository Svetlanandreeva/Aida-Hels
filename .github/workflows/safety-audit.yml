name: Safety Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  safety-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production safety audit on repository source
        run: npm run audit:safety

      - name: TypeScript check
        run: npm run lint

      - name: Production build check
        env:
          JWT_SECRET: ci-safety-audit-only-secret-not-for-production
        run: npm run build
