name: Safety Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  safety-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply production hardening
        run: |
          node scripts/harden-server-auth.mjs
          node scripts/harden-server-access.mjs
          node scripts/harden-integrations.mjs

      - name: TypeScript check
        run: npm run lint

      - name: Production safety audit
        run: npm run audit:safety
