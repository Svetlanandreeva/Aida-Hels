name: Final ICD-10 medical onboarding validation

on:
  push:
    branches: [feat/icd10-medical-onboarding]
    paths:
      - '.github/workflows/validate-icd10-medical-onboarding-final.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - name: Prepare Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Run final checks
        shell: bash
        run: |
          set +e
          mkdir -p ops
          result=ops/icd10-final-validation.txt
          : > "$result"
          status=0
          check() {
            name="$1"; shift
            "$@"
            rc=$?
            if [ "$rc" -eq 0 ]; then echo "$name=success" >> "$result"; else echo "$name=failure:$rc" >> "$result"; status=1; fi
          }
          cd frontend
          check yarn_install yarn install --frozen-lockfile --non-interactive --network-timeout 60000
          check frontend_lint yarn lint
          check frontend_typecheck npx --no-install tsc -p tsconfig.deploy.json --pretty false
          check frontend_export npx --no-install expo export --platform web
          cd ..
          check backend_compile python -m py_compile backend/main.py backend/profile_api.py backend/icd10_api.py backend/ai_context.py
          check backend_security python -m pytest backend/security_tests -q
          if [ "$status" -eq 0 ]; then echo 'validation_status=success' >> "$result"; else echo 'validation_status=failure' >> "$result"; fi
          cat "$result"
          exit "$status"
      - name: Persist final summary
        if: always()
        run: |
          set -euo pipefail
          test -f ops/icd10-final-validation.txt || printf 'validation_status=workflow_error\n' > ops/icd10-final-validation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/icd10-final-validation.txt
          git commit -m 'Record final ICD-10 onboarding validation' || exit 0
          git push origin HEAD:feat/icd10-medical-onboarding
