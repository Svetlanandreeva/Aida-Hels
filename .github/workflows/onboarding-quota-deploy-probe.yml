name: Onboarding quota deploy probe

on:
  push:
    branches: [ops/oauth-runtime-probe-20260823]
    paths:
      - '.github/workflows/onboarding-quota-deploy-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUVDS_HOST: ${{ secrets.RUVDS_HOST }}
      RUVDS_USER: ${{ secrets.RUVDS_USER }}
      RUVDS_PORT: ${{ secrets.RUVDS_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          RUVDS_SSH_KEY: ${{ secrets.RUVDS_SSH_KEY }}
          RUVDS_SSH_KNOWN_HOSTS: ${{ secrets.RUVDS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RUVDS_SSH_KEY" > ~/.ssh/ruvds
          printf '%s\n' "$RUVDS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ruvds ~/.ssh/known_hosts
      - name: Check deployed markers
        run: |
          set -euo pipefail
          ssh -p "$RUVDS_PORT" -i ~/.ssh/ruvds -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$RUVDS_USER@$RUVDS_HOST" <<'EOF' > onboarding-quota-deploy-result.txt
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          frontend = Path('/opt/aida/web').exists()
          backend_source = Path('/opt/aida/backend/profile_api.py').read_text(encoding='utf-8')
          # The web bundle is minified, so backend source is the deterministic server marker;
          # frontend deployment is tied to the same atomic workflow upload.
          backend_ready = (
              'sync_goal_puzzle = finishing_onboarding or (was_completed and goals_changed)' in backend_source
              and 'Draft goal changes during onboarding are frequent' in backend_source
          )
          print('backend_onboarding_quota_guard_deployed=' + str(backend_ready).lower())
          print('web_bundle_present=' + str(frontend).lower())
          PY
          EOF
          mkdir -p ops
          mv onboarding-quota-deploy-result.txt ops/onboarding-quota-deploy-result.txt
          cat ops/onboarding-quota-deploy-result.txt
      - name: Persist result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/onboarding-quota-deploy-result.txt
          git commit -m 'Record onboarding quota deploy probe' || exit 0
          git push origin HEAD:ops/oauth-runtime-probe-20260823
