name: Refresh device integration lockfile once

on:
  push:
    branches:
      - feature/device-health-integrations-v1
    paths:
      - .github/workflows/refresh-device-lock-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/device-health-integrations-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - name: Refresh lockfile
        working-directory: frontend
        run: |
          yarn install --ignore-scripts
          yarn install --frozen-lockfile --ignore-scripts
      - name: Commit lockfile and remove workflow
        run: |
          rm .github/workflows/refresh-device-lock-once.yml
          git config user.name "Svetlana Andreeva"
          git config user.email "AnbreevaSveta@yandex.ru"
          git add frontend/yarn.lock .github/workflows/refresh-device-lock-once.yml
          git commit -m "Sync lockfile for Expo build properties"
          git push origin HEAD:feature/device-health-integrations-v1
