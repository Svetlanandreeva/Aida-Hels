name: Production-equivalent ICD-10 validation

on:
  push:
    branches: [feat/icd10-medical-onboarding]
    paths:
      - '.github/workflows/validate-icd10-medical-onboarding-v2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - name: Prepare Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Run production-equivalent checks
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE"
          RESULT="$ROOT/ops/icd10-validation-v2.txt"
          mkdir -p "$ROOT/ops"
          : > "$RESULT"
          status=0
          check() {
            name="$1"; shift
            echo "== $name =="
            "$@"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "$name=success" >> "$RESULT"
            else
              echo "$name=failure:$rc" >> "$RESULT"
              status=1
            fi
          }

          cd "$ROOT/frontend"
          check frontend_install yarn install --frozen-lockfile --non-interactive --network-timeout 60000
          check frontend_lint yarn lint
          check frontend_typecheck npx --no-install tsc -p tsconfig.deploy.json --pretty false
          check frontend_export npx --no-install expo export -p web

          cd "$ROOT/backend"
          check backend_dependencies python -m pip install -q -r requirements.txt
          check backend_compile python -m compileall -q .
          check backend_import env PYTHONPATH=. python -c 'import main; assert main.app is not None'
          check backend_security env PYTHONPATH=. pytest -q security_tests

          if [ "$status" -eq 0 ]; then
            echo 'validation_status=success' >> "$RESULT"
          else
            echo 'validation_status=failure' >> "$RESULT"
          fi
          cat "$RESULT"
          exit "$status"
      - name: Persist summary
        if: always()
        run: |
          set -euo pipefail
          RESULT="$GITHUB_WORKSPACE/ops/icd10-validation-v2.txt"
          test -f "$RESULT" || printf 'validation_status=workflow_error\n' > "$RESULT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/icd10-validation-v2.txt
          git commit -m 'Record production-equivalent ICD-10 validation' || exit 0
          git push origin HEAD:feat/icd10-medical-onboarding
